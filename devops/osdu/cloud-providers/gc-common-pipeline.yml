variables:
  GC_GCR_REGISTRY: "gcr.io/osdu-anthos"
  APP_VERSION: "$GC_HELM_PACKAGE_VERSION-SNAPSHOT"

.gc_obtain_credentials:
  script:
    - |
      echo "$GITLAB_OIDC_TOKEN" > token.txt
      gcloud iam workload-identity-pools create-cred-config \
      projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID} \
      --service-account=${GC_SA_EMAIL} \
      --service-account-token-lifetime-seconds=1800 \
      --output-file=$CI_PROJECT_DIR/credentials.json \
      --credential-source-file=token.txt
    - export GOOGLE_APPLICATION_CREDENTIALS=$CI_PROJECT_DIR/credentials.json
    - gcloud auth login --cred-file=$CI_PROJECT_DIR/credentials.json

.gc_common:
  script:
    - apk add --no-cache bash jq
    - gcloud components install kubectl --quiet
    - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
    - gcloud container clusters get-credentials $GC_CLUSTER --zone $GC_ZONE --project $GC_PROJECT
    - curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | VERIFY_CHECKSUM=false bash
    - >
      if helm status $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE -n $GC_HELM_NAMESPACE;
      then
        HELM_REVISION=$(helm history $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE -o json | jq '.[] | select(.status == "pending-upgrade").revision')
        if [[ ! -z "$HELM_REVISION" ]]; then kubectl delete secret sh.helm.release.v1.$SEISMIC_GC_HELM_DEPLOYMENT_SERVICE.v$HELM_REVISION; fi
      fi

.gc_define_version:
  script:
    - >
      if [[ -z $CI_COMMIT_TAG ]] && [[ $CI_COMMIT_BRANCH =~ ^release\/[0-9]{1,2}.[0-9]{1,2}$ ]];
      then
        RELEASE_VERSION=$(echo $CI_COMMIT_BRANCH | sed "s?^release/??");
        VERSION="$RELEASE_VERSION.0-release";
      elif [[ $CI_COMMIT_TAG =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]];
      then
        VERSION=$(echo $CI_COMMIT_TAG | sed "s/^v//");
      else
        VERSION="0.0.0-invalid";
      fi

.gc_define_app_version:
  script:
    - >
      if [[ "$CI_COMMIT_TAG" != "" ]];
      then APP_VERSION=$(echo $CI_COMMIT_TAG | sed "s/^v//");
      fi

# Requires variables: IMAGE_TAG, IMAGE_NAME
.gc_substitute_image_in_helm:
  script:
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG" yq -i '.data.image = env(IMAGE)' $SEISMIC_GC_HELM_DEPLOYMENT_DIR/values.yaml
    - yq -e '.data | has("bootstrapImage")' $SEISMIC_GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && BOOTSTRAP_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_BOOTSTRAP_NAME:$IMAGE_TAG" yq -i '.data.bootstrapImage = env(BOOTSTRAP_IMAGE)' $SEISMIC_GC_HELM_DEPLOYMENT_DIR/values.yaml
    - cat $SEISMIC_GC_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image

.gc_set_image_name:
  script:
    - >
      if echo $CI_COMMIT_REF_NAME | grep -Eq "^release\/[0-9]{1,2}.[0-9]{1,2}$";
      then
        export IMAGE_NAME=$IMAGE_NAME-release;
      fi
    - >
      if [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]];
      then
        export IMAGE_NAME=$IMAGE_NAME-master;
      fi
    - >
      if [[ "$CI_COMMIT_TAG" != "" ]];
      then
        IMAGE_TAG="$CI_COMMIT_TAG";
        EXTRA_TAG="-t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG";
      elif [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]];
      then
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA";
        HELM_TAG="latest"
        EXTRA_TAG="-t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA";
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA";
        HELM_TAG="$CI_COMMIT_SHORT_SHA"
        EXTRA_TAG="-t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA";
      fi

.gc_verify_deploy:
  script:
    - echo ----- Verify Deployment -----
    - kubectl rollout status deployment.v1.apps/$SEISMIC_GC_SERVICE -n $GC_HELM_NAMESPACE --timeout=900s
    - POD=$(kubectl get pod --sort-by=.metadata.creationTimestamp -n $GC_HELM_NAMESPACE | grep $SEISMIC_GC_SERVICE | tail -1 | awk '{print $1}')
    - STATUS=$(kubectl wait -n $GC_HELM_NAMESPACE --for=condition=Ready pod/$POD --timeout=1200s)
    - echo $STATUS
    - >
      if [[ "$STATUS" != *"met"* ]];
      then echo "POD didn't start correctly"; exit 1; fi

.gc-helm-charts-gitlab:
  stage: containerize
  tags: ["osdu-small"]
  image:
    name: alpine/helm:3.11.2
    entrypoint: [""]
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.gc_set_image_name, script]
    - !reference [.gc_substitute_image_in_helm, script]
  script:
    - !reference [.gc_define_app_version, script]
    - helm package $SEISMIC_GC_HELM_DEPLOYMENT_DIR -u --version $GC_HELM_PACKAGE_VERSION-$HELM_TAG --app-version $APP_VERSION
    - helm push gc-$SEISMIC_GC_SERVICE-deploy-$GC_HELM_PACKAGE_VERSION-$HELM_TAG.tgz oci://$CI_REGISTRY_IMAGE/gc-helm
  rules:
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: never
    - if: '$GC == "1"'
      when: on_success

.gc-helm-charts-release-gitlab:
  stage: containerize
  tags: ["osdu-small"]
  image:
    name: alpine/helm:3.11.2
    entrypoint: [""]
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.gc_set_image_name, script]
    - !reference [.gc_substitute_image_in_helm, script]
  script:
    - !reference [.gc_define_version, script]
    - helm package $SEISMIC_GC_HELM_DEPLOYMENT_DIR -u --version $VERSION --app-version $VERSION
    - helm push gc-$SEISMIC_GC_SERVICE-deploy-$VERSION.tgz oci://$CI_REGISTRY_IMAGE/gc-helm
  rules:
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

.gc-helm-charts-release-gcr:
  environment:
    name: GC_Baremetal
  stage: containerize
  tags: ["osdu-small"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  image:
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache bash
    - curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | VERIFY_CHECKSUM=false bash
    - !reference [.gc_obtain_credentials, script]
    - gcloud auth configure-docker gcr.io --quiet
    - !reference [.gc_set_image_name, script]
    - !reference [.gc_substitute_image_in_helm, script]
  script:
    - !reference [.gc_define_version, script]
    - helm package $SEISMIC_GC_HELM_DEPLOYMENT_DIR -u --version $VERSION --app-version $VERSION
    - helm push gc-$SEISMIC_GC_SERVICE-deploy-$VERSION.tgz oci://$GC_GCR_REGISTRY/helm
  rules:
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

.gc-containerize-gitlab:
  stage: containerize
  tags: ["osdu-medium"]
  extends: .gc-variables
  image: docker:19.03
  cache: {}
  script:
    - !reference [.gc_set_image_name, script]
    - docker build $EXTRA_TAG --file $SEISMIC_GC_DOCKERFILE_NAME .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME
  rules:
    - if: '$GC == "1"'
      when: on_success

.gc-containerize-gcr:
  environment:
    name: GC_Baremetal
  stage: containerize
  tags: ["osdu-medium"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  extends: .gc-baremetal-variables
  image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
  cache: {}
  services:
    - docker:dind
  before_script:
    - !reference [.gc_obtain_credentials, script]
    - gcloud auth configure-docker gcr.io --quiet
    - cd app/$SDMS_SERVICE
    - sed -i 's|#{SDMS_PREFIX}#|'$GC_SDMS_PREFIX'|' ./docs/api/openapi.osdu.yaml
  script:
    - docker build -t $GC_GCR_REGISTRY/$SEISMIC_GC_SERVICE/$IMAGE_NAME:$CI_COMMIT_TAG -f $SEISMIC_GC_DOCKERFILE_NAME .
    - docker push $GC_GCR_REGISTRY/$SEISMIC_GC_SERVICE/$IMAGE_NAME:$CI_COMMIT_TAG
  rules:
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

.gc-deploy:
  environment:
    name: Google_Cloud
  stage: deploy
  retry: 1
  tags: ["osdu-small"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  extends: .gc-variables
  image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
  cache: {}
  script:
    - !reference [.gc_obtain_credentials, script]
    - !reference [.gc_common, script]
    - !reference [.gc_define_version, script]
    - !reference [.gc_set_image_name, script]
    - >
      helm upgrade $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE oci://$CI_REGISTRY_IMAGE/gc-helm/gc-$SEISMIC_GC_SERVICE-deploy
      --version $GC_HELM_PACKAGE_VERSION-$HELM_TAG
      --install
      --create-namespace
      --namespace=$GC_HELM_NAMESPACE
      --wait
      --timeout=1200s
      --history-max=3
      --set data.serviceAccountName=$SEISMIC_GC_SERVICE
      --set global.domain=$GC_DOMAIN
      --set data.serviceCloudProject=$GC_PROJECT
    - !reference [.gc_verify_deploy, script]
  rules:
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

.gc-dev2-deploy:
  environment:
    name: GC_Dev2
  stage: deploy
  retry: 1
  tags: ["osdu-small"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  extends: .gc-dev2-variables
  image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
  script:
    - !reference [.gc_obtain_credentials, script]
    - !reference [.gc_common, script]
    - !reference [.gc_define_version, script]
    - !reference [.gc_set_image_name, script]
    - >
      helm upgrade $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE oci://$CI_REGISTRY_IMAGE/gc-helm/gc-$SEISMIC_GC_SERVICE-deploy
      --version $VERSION
      --install
      --create-namespace
      --namespace=$GC_HELM_NAMESPACE
      --wait
      --history-max=3
      --set data.imagePullPolicy=Always
      --set data.serviceAccountName=$SEISMIC_GC_SERVICE
      --set global.domain=$GC_DOMAIN
      --set data.appEnvironmentIdentifier=$DATA_PARTITION_ID
      --set data.serviceCloudProject=$GC_PROJECT
    - !reference [.gc_verify_deploy, script]
  rules:
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

.gc-preship-deploy:
  environment:
    name: GC_Preship
  stage: deploy_preship
  retry: 1
  tags: ["osdu-small"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  extends: .gc-preship-variables
  image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
  script:
    - !reference [.gc_obtain_credentials, script]
    - !reference [.gc_common, script]
    - !reference [.gc_define_version, script]
    - !reference [.gc_set_image_name, script]
    - >
      helm upgrade $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE oci://$CI_REGISTRY_IMAGE/gc-helm/gc-$SEISMIC_GC_SERVICE-deploy
      --version $VERSION
      --install
      --create-namespace
      --namespace=$GC_HELM_NAMESPACE
      --wait
      --history-max=3
      --set data.imagePullPolicy=Always
      --set data.serviceAccountName=$SEISMIC_GC_SERVICE
      --set data.appEnvironmentIdentifier=$DATA_PARTITION_ID
      --set data.serviceCloudProject=$GC_PROJECT
      --set global.domain=$GC_DOMAIN
    - !reference [.gc_verify_deploy, script]
  rules:
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: manual
      allow_failure: true

.gc-baremetal-deploy:
  environment:
    name: GC_Baremetal
  stage: deploy
  retry: 1
  tags: ["osdu-small"]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  extends: .gc-baremetal-variables
  image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
  script:
    - !reference [.gc_obtain_credentials, script]
    - !reference [.gc_common, script]
    - !reference [.gc_define_version, script]
    - !reference [.gc_set_image_name, script]
    - >
      helm upgrade $SEISMIC_GC_HELM_DEPLOYMENT_SERVICE oci://$CI_REGISTRY_IMAGE/gc-helm/gc-$SEISMIC_GC_SERVICE-deploy
      --version $GC_HELM_PACKAGE_VERSION-$HELM_TAG
      --install
      --create-namespace
      --namespace=$GC_HELM_NAMESPACE
      --wait
      --history-max=3
      --set data.cloudProvider=anthos
      --set data.serviceAccountName=$SEISMIC_GC_SERVICE
      --set global.domain=$GC_DOMAIN
      --set global.onPremEnabled=true
    - !reference [.gc_verify_deploy, script]
  rules:
    - if: '$GC == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$GC == "1" && $CI_COMMIT_TAG'
      when: on_success

