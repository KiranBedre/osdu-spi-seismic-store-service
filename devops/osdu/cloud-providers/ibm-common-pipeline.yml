ibm-deploy:
  needs: []
  script:
      echo 'empty'
  rules:
     - if: $DISABLED == 'true'

ibm-deploy-devpri:
  needs: []
  script:
      echo 'empty'
  rules:
     - if: $DISABLED == 'true'

ibm-test:
  needs: []
  extends: []
  script:
      echo 'empty'
  only:
      - $DISABLED == 'true'

ibm-test-py:
  needs: []
  extends: []
  script:
      echo 'empty'
  only:
      - $DISABLED == 'true'

ibm-preship-promote:
  needs: []
  extends: []
  script:
      echo 'empty'
  rules:
     - if: $DISABLED == 'true'

ibm-preship-promote-release:
  needs: []
  extends: []
  script:
      echo 'empty'
  rules:
     - if: $DISABLED == 'true'

ibm-helm-charts-master:
  extends: .ibm
  stage: build
  script:
    echo 'empty'
  rules:
    - if: $DISABLED == 'true'

.ibm-deploy:
  extends: .ibm
  stage: deploy
  only:
    variables:
      - $IBM == '1' && $IBM_OPENSHIFT_URL && $IBM_OPENSHIFT_TOKEN
      
.ibm-deploy-devpri:
  extends: .ibm
  stage: deploy
  rules:
     - if: $IBM == '1' && $IBM_OPENSHIFT_DEV_URL && $IBM_OPENSHIFT_DEV_TOKEN
       when: always
     - if: '$CI_COMMIT_BRANCH == "master"'
     
.ibm-test-py:
  stage: integration
  extends:
    - .ibm_variables
  only:
    variables:
      - $IBM == '1'
  except:
    variables:
      - $IBM_SKIP_TEST == 'true'

.ibm-preship-promote:
  extends: .ibm
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

.ibm-preship-promote-release:
  extends: .ibm
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $IBM_PRESHIP_RELEASE_BRANCH'

.ibm-helm-charts-master:
  extends: .ibm
  stage: build
  tags: ["osdu-small"]
  image:
    name: alpine/helm:3.6.3
    entrypoint: [""]
  script:
    - helm plugin install https://github.com/chartmuseum/helm-push.git
    - helm cm-push ${IBM_HELM_CONFIG_PATH} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable --username gitlab-ci-token --password $CI_JOB_TOKEN
    - helm cm-push ${IBM_HELM_DEPLOY_PATH} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable --username gitlab-ci-token --password $CI_JOB_TOKEN
    - if [[ ! -z "$IBM_HELM_BOOTSTRAP_PATH" ]]; then helm cm-push ${IBM_HELM_BOOTSTRAP_PATH} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable --username gitlab-ci-token --password $CI_JOB_TOKEN; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
