include:

  # VARIABLES
  - local: "app/sdms/devops/osdu/variables/variables.yml"

  # BUILD
  - local: "app/sdms/devops/osdu/build/compile-and-unit-test.yml"

  # SCANNERS
  # fossa
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-npm.yml"
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FOSSA_API_KEY
      - if: $CI_COMMIT_TAG && $FOSSA_API_KEY
      - if: $CI_COMMIT_BRANCH =~ 'trusted-.+' && $FOSSA_API_KEY
      - if: $CI_COMMIT_REF_PROTECTED && $FOSSA_API_KEY
      - if: $FOSSA_API_KEY
        changes:
          - app/sdms/**/*
    ref: release/0.29
    # overwrite logic
  - local: "app/sdms/devops/osdu/scanners/fossa-npm.yml"
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FOSSA_API_KEY
      - if: $CI_COMMIT_TAG && $FOSSA_API_KEY
      - if: $CI_COMMIT_BRANCH =~ 'trusted-.+' && $FOSSA_API_KEY
      - if: $CI_COMMIT_REF_PROTECTED && $FOSSA_API_KEY
      - if: $FOSSA_API_KEY
        changes:
          - app/sdms/**/*

  # cspell
  - local: "app/sdms/devops/osdu/scanners/cspell-node.yml"

  # lint
  - local: "app/sdms/devops/osdu/scanners/lint-node.yml"

  # markdownlint
  - local: "app/sdms/devops/osdu/scanners/markdownlint-node.yml"

  # ultimate
  - local: "app/sdms/devops/osdu/scanners/gitlab-ultimate.yml"

  # CLOUD PROVIDERS
  # aws
  - local: "app/sdms/devops/osdu/cloud-providers/aws-global.yml"

  # azure
  - local: "app/sdms/devops/osdu/cloud-providers/azure.yml"

  # gc
  - local: "app/sdms/devops/osdu/cloud-providers/gc-global.yml"

  # core
  - local: "app/sdms/devops/osdu/cloud-providers/core-global.yml"

  # ibm
  - local: "app/sdms/devops/osdu/cloud-providers/ibm.yml"
