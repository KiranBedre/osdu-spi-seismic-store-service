sdms_lint:
  image: node
  stage: scan
  needs: ['sdms_compile-and-unit-test']
  allow_failure: true
  before_script:
    - cd app/$SDMS_SERVICE
  script:
    - npm install -g typescript
    - npm install -g tslint
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: never
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-'
      when: always
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: always
