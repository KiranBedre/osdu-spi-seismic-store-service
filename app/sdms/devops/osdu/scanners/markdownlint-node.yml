sdms_markdownlint:
  image: node
  tags: ["osdu-small"]
  stage: scan
  needs: ['sdms_compile-and-unit-test']
  allow_failure: true
  script:
    - cd app/$SDMS_SERVICE
    - cp ../../.markdownlint.json .
    - npm install -g typescript
    - npm install -g markdownlint-cli
    - markdownlint "**/*.md" > ../../markdownlint_report.txt
  artifacts:
    paths:
      - markdownlint_report.txt
    when: always
    expire_in: 2 days
  only:
    changes:
      - devops/**/*
      - app/sdms/**/*
    refs:
      - branches
      - merge_requests
