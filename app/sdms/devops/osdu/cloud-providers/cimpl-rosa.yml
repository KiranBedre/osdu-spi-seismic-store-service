    CIMPL_SEISTORE_LEGALTAG02: osdu-osdu-demo-legaltag
    CIMPL_SEISTORE_ADMIN_EMAIL: integration-tester@service.local
  allow_failure: true
  retry: 1
  script:
    - cd app/$SDMS_SERVICE
    - apt-get update
    - apt-get install -yq jq curl
    - >
      CIMPL_ID_TOKEN=$(curl --location --silent --request POST "${TEST_OPENID_PROVIDER_URL}/protocol/openid-connect/token"
      --header 'Content-Type: application/x-www-form-urlencoded'
      --data-urlencode grant_type=client_credentials
      --data-urlencode scope=openid
      --data-urlencode client_id=${TEST_OPENID_PROVIDER_CLIENT_ID}
      --data-urlencode client_secret=${TEST_OPENID_PROVIDER_CLIENT_SECRET} | jq -r .id_token)
    - mkdir -pv "cimpl/allure-results" "$CI_PROJECT_DIR/tests/cimpl"
    - chmod +x ./tests/e2e/run_e2e_tests.sh
    - >
      ./tests/e2e/run_e2e_tests.sh
      --seistore-svc-url="${HOST}${CIMPL_SDMS_PREFIX}"
      --seistore-svc-api-key="NA"
      --user-idtoken="$CIMPL_ID_TOKEN"
      --tenant="${CIMPL_TENANT}"
      --admin-email="${CIMPL_SEISTORE_ADMIN_EMAIL}"
      --datapartition="${DEFAULT_DATA_PARTITION_ID_TENANT1}"
      --legaltag01="${CIMPL_SEISTORE_LEGALTAG01}"
      --legaltag02="${CIMPL_SEISTORE_LEGALTAG02}"
      --VCS-Provider="${ISGITLAB}"
      --hostname="${HOST}"
      --domain_name="${DOMAIN:-group}"
      --entitlements_user="${CIMPL_SEISTORE_ADMIN_EMAIL}"
      --allure-dir="cimpl/allure-results"
  after_script:
    - mkdir -pv "$CI_PROJECT_DIR/tests/cimpl"
    - cp -avr "app/$SDMS_SERVICE/cimpl/allure-results" "$CI_PROJECT_DIR/tests/cimpl/"
  artifacts:
    when: always
    paths:
      - tests/cimpl/allure-results/
    expire_in: 1 month
  rules:
    - if: '$CIMPL_INT_TEST_TYPE == "python" && $CIMPL == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$CIMPL_INT_TEST_TYPE == "python" && $CIMPL == "1" && $CI_COMMIT_TAG'
      when: on_success