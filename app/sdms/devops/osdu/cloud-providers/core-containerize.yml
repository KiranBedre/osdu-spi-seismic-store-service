sdms_core-containerize-gitlab:
  extends:
    - core-containerize-gitlab
  needs: ['sdms_compile-and-unit-test']
  tags: ['osdu-medium']
  variables:
    SEISMIC_CORE_SERVICE: seismic-store
    CORE_IMAGE_NAME: core-plus-$SEISMIC_CORE_SERVICE
  before_script:
    - cd app/$SDMS_SERVICE
    - sed -i 's|#{SDMS_PREFIX}#|'$CORE_SDMS_PREFIX'|' ./docs/api/openapi.yaml
    - !reference [.core_set_image_name, script]
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
    - docker buildx build --provenance=false --platform "$CORE_SUPPORTED_PLATFORM" $CORE_EXTRA_TAG -f "$CORE_BUILD_PATH" $CORE_BUILD_ARGS --push .
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $CORE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $CORE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CORE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $CORE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CORE == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success
