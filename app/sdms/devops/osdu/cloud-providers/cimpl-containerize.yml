sdms_cimpl-containerize-gitlab:
  extends:
    - cimpl-containerize-gitlab
  needs: ['sdms_compile-and-unit-test']
  tags: ['osdu-medium']
  variables:
    CIMPL_SERVICE: seismic-store
    CIMPL_IMAGE_NAME: cimpl-seismic-store
  before_script:
    - cd app/$SDMS_SERVICE && pwd
    - ls ./docs/api/openapi.yaml && sed -i 's|#{SDMS_PREFIX}#|'$CIMPL_SDMS_PREFIX'|' ./docs/api/openapi.yaml
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CIMPL == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

# Report-only scan of the image above; same rules, so it exists whenever the image is built
sdms_cimpl-container-scanning:
  extends:
    - cimpl-container-scanning
  needs: ['sdms_cimpl-containerize-gitlab']
  variables:
    CIMPL_IMAGE_NAME: cimpl-seismic-store
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $CIMPL == '1'
      allow_failure: true
    - if: $CI_COMMIT_TAG && $CIMPL == '1'
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CIMPL == '1'
      allow_failure: true
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $CIMPL == '1'
      allow_failure: true
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CIMPL == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      allow_failure: true
