sdms_gc-baremetal-deploy:
  extends:
    - gc-baremetal-deploy
  needs: 
    - 'sdms_gc-containerize-gitlab'
    - 'sdms_gc-helm-charts-gitlab'
  variables:
    GC_HELM_DEPLOYMENT_SERVICE: seismic-store-deploy
    GC_HELM_DEPLOYMENT_DIR: "app/sdms/devops/gc/deploy"
    GC_SERVICE: seismic-store
    GC_HELM_TIMEOUT: "--timeout=1200s"
  script:
    - !reference [.gc_obtain_credentials, script]
    - !reference [.gc_set_image_name, script]
    - !reference [.gc_common_config, script]
    - >
      helm upgrade $GC_HELM_DEPLOYMENT_SERVICE oci://$CI_REGISTRY_IMAGE/gc-helm/gc-$GC_SERVICE-deploy
      --version $GC_HELM_PACKAGE_VERSION-$HELM_TAG
      --install
      --create-namespace
      --namespace=$GC_HELM_NAMESPACE
      --wait
      --history-max=3
      --set data.cloudProvider=anthos
      --set data.serviceAccountName=$GC_SERVICE
      --set global.domain=$GC_DOMAIN
      --set global.onPremEnabled=true
      $GC_HELM_SETS
      $GC_HELM_TIMEOUT
    - !reference [.gc_verify_deploy, script]
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_gc-baremetal-test-python:
  extends:
    - gc-baremetal-test-python
  image: node
  needs: ['sdms_gc-baremetal-deploy']
  allow_failure: true
  script:
    - cd app/$SDMS_SERVICE
    - apt-get update
    - apt-get install -y python3
    - apt-get install -y python3-pip
    - pip install google --break-system-packages
    - pip install google-auth --break-system-packages
    - pip install google-api-python-client --break-system-packages
    - pip install google-auth-httplib2 --break-system-packages
    - pip install google-auth-oauthlib --break-system-packages
    - export GC_AUDIENCE=$INTEGRATION_TEST_AUDIENCE
    - export GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_CREDENTIALS
    - svctoken=$(python3 ../../devops/scripts/gc_jwt_client.py)
    - echo $svctoken > /dev/null
    - npm install -g newman
    - chmod +x ./tests/e2e/run_e2e_tests.sh
    - ./tests/e2e/run_e2e_tests.sh --seistore-svc-url="https://${GC_UNIT_HOSTNAME}${GC_SDMS_PREFIX}" --seistore-svc-api-key="NA" --user-idtoken="$GC_INTEGRATION_TESTER" --tenant="${GC_TENANT}" --admin-email="${GC_SEISTORE_ADMIN_EMAIL}" --datapartition="${DATA_PARTITION_ID}" --legaltag01="${GC_SEISTORE_LEGALTAG01}" --legaltag02="${GC_SEISTORE_LEGALTAG02}" --VCS-Provider="${ISGITLAB}"
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success
