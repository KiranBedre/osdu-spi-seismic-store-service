variables:
  #seismic store service variables
  ENV_VAULT: $AZURE_ENV_VAULT
  NAMESPACE: ddms-seismic
  SDMS_SERVICE_NAME: seismic-ddms
  SDMS_SIDECAR_NAME: seismic-ddms-sidecar
  SDMS_DELETION_SERVICE_NAME: seismic-ddms-deletion-service
  SDMS_COMPUTESIZE_SERVICE_NAME: seismic-ddms-computesize-service
  SDMS_CHANGETIER_SERVICE_NAME: seismic-ddms-changetier-service
  SDMS_STATISTICS_JOB_NAME: seismic-ddms-statistics-job
  AZURE_SDMS_PREFIX: /seistore-svc/api/v3
  E2E_SUBPROJECT: demosandbox08
  E2E_ADMIN_EMAIL: $AZURE_AD_USER_EMAIL
  E2E_DATA_PARTITION: $TENANT_NAME
  E2E_LEGALTAG01: $LEGAL_TAG
  E2E_LEGALTAG02: opendes-dps-integration-test-valid2-legal-tag
  E2E_TENANT: $TENANT_NAME
  E2E_DOMAINANAME: contoso.com
  E2E_HOSTNAME: https://$AZURE_DNS_NAME
  E2E_ENTITLEMENTS_USER: $INTEGRATION_TESTER

.azure_clean_code:
  before_script:
    - cd app/$SDMS_SERVICE
    - sed -i "/anthos/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/anthos
    - sed -i "/google/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/aws
    - sed -i "/aws/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/google
    - sed -i "/ibm/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/ibm
    - sed -i "/TestGoogle/d" tests/utest/cloud/test.ts
    - sed -i "/TestGCS/d" tests/utest/cloud/test.ts
    - rm -Rf tests/utest/cloud/google
    - rm -Rf tests/utest/dao
    - rm -Rf tests/utest/services
    - sed -i 's|#{SDMS_PREFIX}#|'$AZURE_SDMS_PREFIX'|' ./docs/api/openapi.yaml
    - jq "del(.prisma)" package.json > cleaned_package.json
    - mv cleaned_package.json package.json
    - export directoryToScan=$PWD
    - export currentDirectory=$PWD
    - chmod +x devops/scripts/detect_unused_packages.sh
    - devops/scripts/detect_unused_packages.sh
    - chmod +x devops/scripts/clean_package_json.sh
    - devops/scripts/clean_package_json.sh

sdms_azure_containerize:
  extends:
    - .azure_clean_code
    - azure_containerize
  needs:
    - job: sdms_compile-and-unit-test
    - job: sdms_sidecar_compile-and-unit-test
      optional: true
  variables:
    SHA_IMAGE: ${SDMS_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_SIDECAR_IMAGE: ${SDMS_SIDECAR_NAME}:${CI_COMMIT_SHA}
    SHA_DELETION_SERVICE_IMAGE: ${SDMS_DELETION_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_COMPUTESIZE_SERVICE_IMAGE: ${SDMS_COMPUTESIZE_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_CHANGETIER_SERVICE_IMAGE: ${SDMS_CHANGETIER_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_STATISTICS_JOB_IMAGE: ${SDMS_STATISTICS_JOB_NAME}:${CI_COMMIT_SHA}
    SDMS_SIDECAR_IMAGE: $SDMS_SIDECAR_NAME
    SDMS_DELETION_SERVICE_IMAGE: $SDMS_DELETION_SERVICE_NAME
    SDMS_COMPUTESIZE_SERVICE_IMAGE: $SDMS_COMPUTESIZE_SERVICE_NAME
    SDMS_CHANGETIER_SERVICE_IMAGE: $SDMS_CHANGETIER_SERVICE_NAME
    SDMS_STATISTICS_JOB_IMAGE: $SDMS_STATISTICS_JOB_NAME
    LATEST_IMAGE: ${SDMS_SERVICE_NAME}:latest
    LATEST_SIDECAR_IMAGE: ${SDMS_SIDECAR_NAME}:latest
    LATEST_DELETION_SERVICE_IMAGE: ${SDMS_DELETION_SERVICE_NAME}:latest
    LATEST_COMPUTESIZE_SERVICE_IMAGE: ${SDMS_COMPUTESIZE_SERVICE_NAME}:latest
    LATEST_CHANGETIER_SERVICE_IMAGE: ${SDMS_CHANGETIER_SERVICE_NAME}:latest
    LATEST_STATISTICS_JOB_IMAGE: ${SDMS_STATISTICS_JOB_NAME}:latest
    RELEASE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_SIDECAR_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_SIDECAR_NAME}-${CI_COMMIT_TAG}
    RELEASE_DELETION_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_DELETION_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_COMPUTESIZE_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_COMPUTESIZE_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_CHANGETIER_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_CHANGETIER_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_STATISTICS_JOB_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_STATISTICS_JOB_NAME}-${CI_COMMIT_TAG}
  before_script:
    - !reference [.azure_clean_code, before_script]
    - !reference [azure_containerize, before_script]
  script:
    # Runtime image
    - docker build --build-arg docker_node_image_version=${SDMS_RUNTIME_NODE_VERSION} -t $SDMS_UTEST_RUNTIME_IMAGE --file devops/azure/runtime.Dockerfile .
    # Sidecar image
    - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_SIDECAR_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.QueryRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Deletion service image
    - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_DELETION_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.DeleteOperationRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Compute-size service image
    # - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_COMPUTESIZE_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.ComputeSizeRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Change-tier service image
    - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_CHANGETIER_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.ChangeTierRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Statistics job
    - docker build -t $SDMS_STATISTICS_JOB_IMAGE -f ./programs/azure/collector/Dockerfile ./programs/azure/collector
    # Gitlab Container Registry
    # Runtime image
    - docker tag $SDMS_UTEST_RUNTIME_IMAGE $CI_REGISTRY_IMAGE/$SHA_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE $CI_REGISTRY_IMAGE/$LATEST_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE
    - docker tag ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE $CI_REGISTRY_IMAGE/${SDMS_PROJECT_NAME}azure:${CI_COMMIT_SHA}
    - docker push $CI_REGISTRY_IMAGE/${SDMS_PROJECT_NAME}azure:${CI_COMMIT_SHA}
    # Sidecar image
    - docker tag $SDMS_SIDECAR_IMAGE $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_SIDECAR_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE $CI_REGISTRY_IMAGE/$LATEST_SIDECAR_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_SIDECAR_IMAGE
    # Deletion service image
    - docker tag $SDMS_DELETION_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_DELETION_SERVICE_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_DELETION_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_DELETION_SERVICE_IMAGE
    # Compute-size service image
    # - docker tag $SDMS_COMPUTESIZE_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker tag $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # Change-tier service image
    - docker tag $SDMS_CHANGETIER_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_CHANGETIER_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_CHANGETIER_SERVICE_IMAGE
    # Job statistics image
    - docker tag $SDMS_STATISTICS_JOB_IMAGE $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_STATISTICS_JOB_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE $CI_REGISTRY_IMAGE/$LATEST_STATISTICS_JOB_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_STATISTICS_JOB_IMAGE
    # Azure Container Registry
    # Runtime image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_UTEST_RUNTIME_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_IMAGE
      fi
    # Sidecar image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_SIDECAR_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_SIDECAR_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_SIDECAR_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_SIDECAR_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_SIDECAR_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_SIDECAR_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_SIDECAR_IMAGE
      fi
    # Deletion service image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_DELETION_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_DELETION_SERVICE_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_DELETION_SERVICE_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_DELETION_SERVICE_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_DELETION_SERVICE_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_DELETION_SERVICE_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_DELETION_SERVICE_IMAGE
      fi
    # Compute-size service image
    # - az acr login -n $AZURE_REGISTRY
    # - docker tag $SDMS_COMPUTESIZE_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker tag $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # - |
    #   if [ ! -z "$CI_COMMIT_TAG" ]; then
    #     docker tag $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_COMPUTESIZE_SERVICE_IMAGE
    #     docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_COMPUTESIZE_SERVICE_IMAGE
    #   fi
    # Change-tier service image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_CHANGETIER_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_CHANGETIER_SERVICE_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_CHANGETIER_SERVICE_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_CHANGETIER_SERVICE_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_CHANGETIER_SERVICE_IMAGE
      fi
    # Statistics job image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_STATISTICS_JOB_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_STATISTICS_JOB_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_STATISTICS_JOB_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_STATISTICS_JOB_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_STATISTICS_JOB_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE ${AZURE_REGISTRY}.azurecr.io/$RELEASE_STATISTICS_JOB_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$RELEASE_STATISTICS_JOB_IMAGE
      fi
  only: null
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_azure_containerize_helm:
  extends:
    - azure_containerize_helm
  needs:
    - job: sdms_compile-and-unit-test
      artifacts: false
      optional: true
  variables:
    AZURE_HELM_SUBDIR: osdu-ddms/standard-ddms
  only: null
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_container_scanning:
  extends:
    - container_scanning
  needs: ['sdms_azure_containerize']
  variables:
    DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}/${SDMS_PROJECT_NAME}azure:${CI_COMMIT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1' && $IGNORE_CONTAINER_SCANNING == 'true'
      allow_failure: true
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1' && $IGNORE_CONTAINER_SCANNING == 'true'
      allow_failure: true
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1' && $IGNORE_CONTAINER_SCANNING == 'true'
      allow_failure: true
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1' && $IGNORE_CONTAINER_SCANNING == 'true'
      allow_failure: true
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1' && $IGNORE_CONTAINER_SCANNING == 'true'
      changes:
        - devops/**/*
        - app/sdms/**/*
      allow_failure: true
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_azure_deploy:
  extends: azure_deploy
  needs:
    - sdms_azure_containerize
    - sdms_azure_containerize_helm
  script:
    - helm show chart $HELM_CHART_OCI --version $HELM_CHART_OCI_VERSION
    # Uninstall if found in default namespace
    - helm uninstall seismic-store-service -n default --wait || echo [INFO] No seismic-store-service in default
    # Uninstall if found in proper namespace
    - helm uninstall ${SDMS_SERVICE_NAME} -n ${NAMESPACE} --wait || echo [INFO] No seismic-store-service
    # Install/upgrade helm chart
    - >
      helm upgrade -i ${SDMS_SERVICE_NAME} $HELM_CHART_OCI --version $HELM_CHART_OCI_VERSION
      --set azure.tenant=${AZURE_TENANT_ID}
      --set azure.subscription=$AZURE_SUBSCRIPTION_ID
      --set azure.resourcegroup=$(az keyvault secret show --id https://${ENV_VAULT}.vault.azure.net/secrets/base-name-cr --query value -otsv)-rg
      --set azure.identity=$(az keyvault secret show --id https://${ENV_VAULT}.vault.azure.net/secrets/base-name-cr --query value -otsv)-osdu-identity
      --set azure.identity_id=$(az keyvault secret show --id https://${ENV_VAULT}.vault.azure.net/secrets/osdu-identity-id --query value -otsv)
      --set azure.keyvault.name=${ENV_VAULT}
      --set azure.acr=${AZURE_REGISTRY}.azurecr.io
      --set ingress.dns=${AZURE_DNS_NAME}
      --set azure.service_account_id=$(az keyvault secret show --id https://${ENV_VAULT}.vault.azure.net/secrets/app-dev-sp-username --query value -otsv)
      --set configuration[0].config.DES_SERVICE_HOST="https://${AZURE_DNS_NAME}"
      --set configuration[0].container.image=${SDMS_SERVICE_NAME}
      --set configuration[0].container.tag=${CI_COMMIT_SHA}
      --set configuration[0].sidecar.container.image=${SDMS_SIDECAR_NAME}
      --set configuration[0].sidecar.container.tag=${CI_COMMIT_SHA}
      --set configuration[1].container.image=${SDMS_DELETION_SERVICE_NAME}
      --set configuration[1].container.tag=${CI_COMMIT_SHA}
      --set configuration[2].container.image=${SDMS_CHANGETIER_SERVICE_NAME}
      --set configuration[2].container.tag=${CI_COMMIT_SHA}
      --set configuration[3].container.image=${SDMS_STATISTICS_JOB_NAME}
      --set configuration[3].container.tag=${CI_COMMIT_SHA}
      --create-namespace
      -n ${NAMESPACE} -f app/sdms/devops/azure/${SDMS_SERVICE_NAME}.osdu.values.yaml --wait --timeout 10m
    # Wait for service to be running to start
    - |
      kubectl rollout status deployment.v1.apps/${SDMS_SERVICE_NAME} -n ${NAMESPACE} --timeout=900s
      RESULT=$?
      if [ $RESULT == 0 ]; then
        echo "Rollout succeeded."
      else
        kubectl delete pod -l app=${SDMS_SERVICE_NAME} -n ${NAMESPACE}
        kubectl rollout status deployment.v1.apps/${SDMS_SERVICE_NAME} -n ${NAMESPACE} --timeout=900s
      fi
    - pod=$(kubectl -n ddms-seismic get po -l app=${SDMS_SERVICE_NAME} --no-headers=true -o custom-columns=":metadata.name" | tail -1)
    - status=$(kubectl wait -n ${NAMESPACE} --for=condition=Ready pod/$pod --timeout=600s)
    - if [[ "$status" != *"met"* ]]; then echo "${SDMS_SERVICE_NAME} pod didn't start correctly" ; exit 1 ; fi
  artifacts: null
  only: null
  except: null
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1' && $AZURE_SKIP_DEPLOY != 'true'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1' && $AZURE_SKIP_DEPLOY != 'true'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1' && $AZURE_SKIP_DEPLOY != 'true'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1' && $AZURE_SKIP_DEPLOY != 'true'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1' && $AZURE_SKIP_DEPLOY != 'true'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_azure_test:
  image: node:${SDMS_NODE_VERSION}
  extends:
    - .azure_clean_code
    - azure_test
    - .azure_variables
  needs: ['sdms_azure_deploy']
  variables:
    AZURE_AD_APP_RESOURCE_ID: $AZURE_APP_ID
    AZURE_AD_TENANT_ID: $AZURE_TENANT_ID
    AZURE_TESTER_SERVICEPRINCIPAL_SECRET: $AZURE_PRINCIPAL_SECRET
    INTEGRATION_TESTER: $AZURE_PRINCIPAL_ID
    TEST_BULK_DELETE: 'true'
    TEST_COMPUTE_SIZE: 'false'
  before_script:
    - apt-get update
    - apt-get install -y jq
    - !reference [.azure_clean_code, before_script]
    - apt-get install -y python3
    - apt-get install -y python3-pip
    - pip3 install --break-system-packages msal
    - export svctoken=$(python3 ${CI_PROJECT_DIR}/devops/scripts/azure_jwt_client.py)
  script:
    - echo $svctoken > /dev/null
    - npm install -g husky
    - npm ci
    - chmod +x ./tests/e2e/run_e2e_tests.sh
    - ./tests/e2e/run_e2e_tests.sh --seistore-svc-url="https://${AZURE_DNS_NAME}${AZURE_SDMS_PREFIX}" --seistore-svc-api-key="NA" --user-idtoken="$svctoken" --tenant="${E2E_TENANT}" --admin-email="${E2E_ADMIN_EMAIL}" --datapartition="${E2E_DATA_PARTITION}" --legaltag01="${E2E_LEGALTAG01}" --legaltag02="${E2E_LEGALTAG02}" --VCS-Provider="${ISGITLAB}"  --subproject="${E2E_SUBPROJECT}" --domain_name="${E2E_DOMAINANAME}" --hostname="${E2E_HOSTNAME}" --entitlements_user="${E2E_ENTITLEMENTS_USER}" --testBulkDelete="${TEST_BULK_DELETE}" --testComputeSize="${TEST_COMPUTE_SIZE}"
  only: null
  except: null
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $AZURE == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_azure-publish:
  needs:
    - sdms_azure_deploy
    - sdms_azure_containerize
    - sdms_azure_containerize_helm
  extends:
    - azure-publish
  variables:
    SHA_IMAGE: ${SDMS_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_SIDECAR_IMAGE: ${SDMS_SIDECAR_NAME}:${CI_COMMIT_SHA}
    SHA_DELETION_SERVICE_IMAGE: ${SDMS_DELETION_SERVICE_NAME}:${CI_COMMIT_SHA} 
    SHA_COMPUTESIZE_SERVICE_IMAGE: ${SDMS_COMPUTESIZE_SERVICE_NAME}:${CI_COMMIT_SHA}
  script:
   - crane copy ${AZURE_REGISTRY}.azurecr.io/$SHA_IMAGE ${DST_REGISTRY}.azurecr.io/$SDMS_SERVICE:${AZ_VER}
   - crane copy ${AZURE_REGISTRY}.azurecr.io/$SHA_SIDECAR_IMAGE ${DST_REGISTRY}.azurecr.io/${SDMS_SIDECAR_NAME}:${AZ_VER}
   - crane copy ${AZURE_REGISTRY}.azurecr.io/$SHA_DELETION_SERVICE_IMAGE ${DST_REGISTRY}.azurecr.io/${SDMS_DELETION_SERVICE_NAME}:${AZ_VER}
  #  - crane copy ${AZURE_REGISTRY}.azurecr.io/$SHA_COMPUTESIZE_SERVICE_IMAGE ${DST_REGISTRY}.azurecr.io/${SDMS_COMPUTESIZE_SERVICE_NAME}:${AZ_VER}
   - crane copy ${HELM_CHART_OCI#"oci://"}:${HELM_CHART_OCI_VERSION} ${DST_REGISTRY}.azurecr.io/helm/${HELM_CHART_SUBDIR}:${HELM_CHART_OCI_VERSION} || echo "[WARN] Not able to publish helm chart"
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $AZURE == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $AZURE == '1'
      when: on_success
