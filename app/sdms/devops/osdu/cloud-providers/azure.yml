variables:
  #seismic store service variables
  ENV_VAULT: $AZURE_ENV_VAULT
  NAMESPACE: ddms-seismic
  SDMS_SERVICE_NAME: seismic-ddms
  SDMS_SIDECAR_NAME: seismic-ddms-sidecar
  SDMS_DELETION_SERVICE_NAME: seismic-ddms-deletion-service
  SDMS_COMPUTESIZE_SERVICE_NAME: seismic-ddms-computesize-service
  SDMS_CHANGETIER_SERVICE_NAME: seismic-ddms-changetier-service
  SDMS_STATISTICS_JOB_NAME: seismic-ddms-statistics-job
  AZURE_SDMS_PREFIX: /seistore-svc/api/v3
  E2E_SUBPROJECT: demosandbox08
  E2E_ADMIN_EMAIL: $AZURE_AD_USER_EMAIL
  E2E_DATA_PARTITION: $TENANT_NAME
  E2E_LEGALTAG01: $LEGAL_TAG
  E2E_LEGALTAG02: opendes-dps-integration-test-valid2-legal-tag
  E2E_TENANT: $TENANT_NAME
  E2E_DOMAINANAME: contoso.com
  E2E_HOSTNAME: https://$AZURE_DNS_NAME
  E2E_ENTITLEMENTS_USER: $INTEGRATION_TESTER

sdms_azure_dotnet_ci:
  image: mcr.microsoft.com/dotnet/sdk:6.0
  stage: build
  needs: []
  coverage: '/  Line coverage: \d+.\d+%/'  # regular expression to parse coverage from the script's stdout
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/cobertura/*/coverage.cobertura.xml
      - ${CI_PROJECT_DIR}/cobertura/*
      - ${CI_PROJECT_DIR}/junit/*-test-result.xml
    reports:
      junit: ${CI_PROJECT_DIR}/junit/*-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: ${CI_PROJECT_DIR}/cobertura/*/coverage.cobertura.xml
  script:
    - cd app/${SDMS_SERVICE}/src/cloud/providers/azure/sidecar
    - dotnet format --version
    - dotnet format --severity warn --verify-no-changes
    - dotnet test -c Debug --results-directory="${CI_PROJECT_DIR}/cobertura/" --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=${CI_PROJECT_DIR}/junit/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    # generate coverage summary and print to stdout:
    - dotnet tool install dotnet-reportgenerator-globaltool --version 5.1.25 --tool-path ./tools
    - ./tools/reportgenerator "-reports:${CI_PROJECT_DIR}/cobertura/**/coverage.cobertura.xml" "-targetdir:${CI_PROJECT_DIR}/cobertura" -reporttypes:TextSummary
    - cat "${CI_PROJECT_DIR}/cobertura/Summary.txt"
  only:
    changes:
      - app/sdms/src/cloud/providers/azure/sidecar/**/*
      - app/sdms/devops/osdu/cloud-providers/azure.yml
    refs:
      - branches
      - merge_requests
      - tags

sdms_azure_containerize:
  extends: .azure_containerize
  environment: $DEPLOY_ENVIRONMENT_AZURE
  needs:
    - job: sdms_azure_dotnet_ci
      optional: true
    - job: sdms_compile-and-unit-test
  variables:
    SHA_IMAGE: ${SDMS_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_SIDECAR_IMAGE: ${SDMS_SIDECAR_NAME}:${CI_COMMIT_SHA}
    SHA_DELETION_SERVICE_IMAGE: ${SDMS_DELETION_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_COMPUTESIZE_SERVICE_IMAGE: ${SDMS_COMPUTESIZE_SERVICE_NAME}:${CI_COMMIT_SHA}
    SHA_CHANGETIER_SERVICE_IMAGE: ${SDMS_CHANGETIER_SERVICE_NAME}:${CI_COMMIT_SHA}
    SDMS_SIDECAR_IMAGE: $SDMS_SIDECAR_NAME
    SDMS_DELETION_SERVICE_IMAGE: $SDMS_DELETION_SERVICE_NAME
    SDMS_COMPUTESIZE_SERVICE_IMAGE: $SDMS_COMPUTESIZE_SERVICE_NAME
    SDMS_CHANGETIER_SERVICE_IMAGE: $SDMS_CHANGETIER_SERVICE_NAME
    SHA_STATISTICS_JOB_IMAGE: ${SDMS_STATISTICS_JOB_NAME}:${CI_COMMIT_SHA}
    SDMS_SIDECAR_IMAGE: $SDMS_SIDECAR_NAME
    SDMS_DELETION_SERVICE_IMAGE: $SDMS_DELETION_SERVICE_NAME
    SDMS_COMPUTESIZE_SERVICE_IMAGE: $SDMS_COMPUTESIZE_SERVICE_NAME
    SDMS_STATISTICS_JOB_IMAGE: $SDMS_STATISTICS_JOB_NAME
    LATEST_IMAGE: ${SDMS_SERVICE_NAME}:latest
    LATEST_SIDECAR_IMAGE: ${SDMS_SIDECAR_NAME}:latest
    LATEST_DELETION_SERVICE_IMAGE: ${SDMS_DELETION_SERVICE_NAME}:latest
    LATEST_COMPUTESIZE_SERVICE_IMAGE: ${SDMS_COMPUTESIZE_SERVICE_NAME}:latest
    LATEST_CHANGETIER_SERVICE_IMAGE: ${SDMS_CHANGETIER_SERVICE_NAME}:latest
    LATEST_STATISTICS_JOB_IMAGE: ${SDMS_STATISTICS_JOB_NAME}:latest
    RELEASE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_SIDECAR_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_SIDECAR_NAME}-${CI_COMMIT_TAG}
    RELEASE_DELETION_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_DELETION_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_COMPUTESIZE_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_COMPUTESIZE_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_CHANGETIER_SERVICE_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_CHANGETIER_SERVICE_NAME}-${CI_COMMIT_TAG}
    RELEASE_STATISTICS_JOB_IMAGE: release-${CI_COMMIT_TAG}:${SDMS_STATISTICS_JOB_NAME}-${CI_COMMIT_TAG}
  script:
    - cd app/$SDMS_SERVICE
    - sed -i "/anthos/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/anthos
    - sed -i "/google/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/aws
    - sed -i "/aws/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/google
    - sed -i "/ibm/d" src/cloud/providers/index.ts
    - rm -Rf src/cloud/providers/ibm
    - sed -i "/TestGoogle/d" tests/utest/cloud/test.ts
    - sed -i "/TestGCS/d" tests/utest/cloud/test.ts
    - rm -Rf tests/utest/cloud/google
    - rm -Rf tests/utest/dao
    - rm -Rf tests/utest/services
    - sed -i 's|#{SDMS_PREFIX}#|'$AZURE_SDMS_PREFIX'|' ./docs/api/openapi.osdu.yaml
    - jq "del(.prisma)" package.json > cleaned_package.json
    - mv cleaned_package.json package.json
    - export directoryToScan=$PWD
    - export currentDirectory=$PWD
    - chmod +x devops/scripts/detect_unused_packages.sh
    - devops/scripts/detect_unused_packages.sh
    - chmod +x devops/scripts/clean_package_json.sh
    - devops/scripts/clean_package_json.sh
    # Runtime image
    - docker build -t $SDMS_UTEST_RUNTIME_IMAGE --file devops/azure/runtime.Dockerfile .
    # Sidecar image
    - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_SIDECAR_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.QueryRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Deletion service image
    # - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_DELETION_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.DeleteOperationRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Compute-size service image
    # - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_COMPUTESIZE_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.ComputeSizeRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Change-tier service image
    - docker build --build-arg PASS=$SIDECAR_CERT_PASS -t $SDMS_CHANGETIER_SERVICE_IMAGE -f ./src/cloud/providers/azure/sidecar/src/Sidecar.ChangeTierRunner/Dockerfile ./src/cloud/providers/azure/sidecar/src/
    # Statistics job
    - docker build -t $SDMS_STATISTICS_JOB_IMAGE -f ./programs/azure/collector/Dockerfile ./programs/azure/collector

    # Gitlab Container Registry
    # Runtime image
    - docker tag $SDMS_UTEST_RUNTIME_IMAGE $CI_REGISTRY_IMAGE/$SHA_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE $CI_REGISTRY_IMAGE/$LATEST_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE
    - docker tag ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE $CI_REGISTRY_IMAGE/${SDMS_PROJECT_NAME}azure:${CI_COMMIT_SHA}
    - docker push $CI_REGISTRY_IMAGE/${SDMS_PROJECT_NAME}azure:${CI_COMMIT_SHA}
    # Sidecar image
    - docker tag $SDMS_SIDECAR_IMAGE $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_SIDECAR_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_SIDECAR_IMAGE $CI_REGISTRY_IMAGE/$LATEST_SIDECAR_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_SIDECAR_IMAGE
    # Deletion service image
    # - docker tag $SDMS_DELETION_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$SHA_DELETION_SERVICE_IMAGE
    # - docker tag $CI_REGISTRY_IMAGE/$SHA_DELETION_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_DELETION_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$LATEST_DELETION_SERVICE_IMAGE
    # Compute-size service image
    # - docker tag $SDMS_COMPUTESIZE_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$SHA_COMPUTESIZE_SERVICE_IMAGE
    # - docker tag $CI_REGISTRY_IMAGE/$SHA_COMPUTESIZE_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # - docker push ${CI_REGISTRY_IMAGE}/$LATEST_COMPUTESIZE_SERVICE_IMAGE
    # Change-tier service image
    - docker tag $SDMS_CHANGETIER_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_CHANGETIER_SERVICE_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_CHANGETIER_SERVICE_IMAGE $CI_REGISTRY_IMAGE/$LATEST_CHANGETIER_SERVICE_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_CHANGETIER_SERVICE_IMAGE
    # Job statistics image
    - docker tag $SDMS_STATISTICS_JOB_IMAGE $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_STATISTICS_JOB_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_STATISTICS_JOB_IMAGE $CI_REGISTRY_IMAGE/$LATEST_STATISTICS_JOB_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_STATISTICS_JOB_IMAGE

    # Azure Container Registry
    # Runtime image
    - az acr login -n $AZURE_REGISTRY
    - docker tag $SDMS_UTEST_RUNTIME_IMAGE ${AZURE_REGISTRY}.azurecr.io/$SHA_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$SHA_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE ${AZURE_REGISTRY}.azurecr.io/$LATEST_IMAGE
    - docker push ${AZURE_REGISTRY}.azurecr.io/$LATEST_IMAGE
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
