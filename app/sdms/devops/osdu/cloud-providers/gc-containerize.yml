sdms_gc-containerize-gitlab:
  extends:
    - gc-containerize-gitlab
  needs: ["sdms_compile-and-unit-test"]
  tags: ["osdu-medium"]
  variables:
    SEISMIC_GC_SERVICE: seismic-store
    IMAGE_NAME: gc-$SEISMIC_GC_SERVICE
  before_script:
    - !reference [.gc_set_image_name, script]
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd app/$SDMS_SERVICE
    - sed -i 's|#{SDMS_PREFIX}#|'$GC_SDMS_PREFIX'|' ./docs/api/openapi.yaml
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_TAG && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_gc-containerize-gcr:
  extends:
    - gc-containerize-gcr
  needs: ["sdms_compile-and-unit-test"]
  tags: ["osdu-medium"]
  variables:
    SEISMIC_GC_SERVICE: seismic-store
    IMAGE_NAME: gc-$SEISMIC_GC_SERVICE
    GC_SERVICE: $SEISMIC_GC_SERVICE
  before_script:
    - apk add --no-cache docker-cli docker-cli-buildx
    - cd app/$SDMS_SERVICE
    - sed -i 's|#{SDMS_PREFIX}#|'$GC_SDMS_PREFIX'|' ./docs/api/openapi.yaml
    - !reference [.gc_obtain_credentials, script]
    - gcloud auth configure-docker gcr.io
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $GC == '1'
      when: never
    - if: $CI_COMMIT_TAG && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      when: never
