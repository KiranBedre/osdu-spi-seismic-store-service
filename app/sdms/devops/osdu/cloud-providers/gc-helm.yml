sdms_gc-helm-charts-gitlab:
  extends:
    - gc-helm-charts-gitlab
  needs: ['sdms_gc-containerize-gitlab']
  variables:
    GC_HELM_DEPLOYMENT_DIR: "app/sdms/devops/gc/deploy"
    GC_SERVICE: seismic-store
    IMAGE_NAME: gc-$GC_SERVICE
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.gc_set_image_name, script]
    - !reference [.gc_substitute_image_in_helm, script]
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_gc-helm-charts-release-gitlab:
  extends:
    - gc-helm-charts-release-gitlab
  needs: ['sdms_gc-containerize-gitlab']
  variables:
    GC_HELM_DEPLOYMENT_DIR: "app/sdms/devops/gc/deploy"
    GC_SERVICE: seismic-store
    IMAGE_NAME: gc-$GC_SERVICE
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      when: never

sdms_gc-helm-charts-release-gcr:
  extends:
    - gc-helm-charts-release-gcr
  needs: ['sdms_gc-containerize-gitlab']
  variables:
    GC_HELM_DEPLOYMENT_DIR: "app/sdms/devops/gc/deploy"
    GC_SERVICE: seismic-store
    IMAGE_NAME: gc-$GC_SERVICE
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/' && $GC == '1'
      when: never
    - if: $CI_COMMIT_TAG && $GC == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $GC == '1'
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $GC == '1'
      when: never
