sdms_cimpl-helm-charts-gitlab:
  extends:
    - cimpl-helm-charts-gitlab
  needs: ['sdms_cimpl-containerize-gitlab']
  variables:
    CIMPL_SERVICE: seismic-store
    CIMPL_IMAGE_NAME: cimpl-seismic-store
    CIMPL_HELM_DEPLOYMENT_DIR: "app/sdms/devops/core-plus/deploy"
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-' && $CIMPL == '1'
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CIMPL == '1'
      changes:
        - devops/**/*
        - app/sdms/**/*
      when: on_success

sdms_cimpl-helm-charts-release-gitlab:
  extends:
    - cimpl-helm-charts-release-gitlab
  needs: ['sdms_cimpl-containerize-gitlab']
  variables:
    CIMPL_SERVICE: seismic-store
    CIMPL_IMAGE_NAME: cimpl-seismic-store
    CIMPL_HELM_DEPLOYMENT_DIR: "app/sdms/devops/core-plus/deploy"
  rules:
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
