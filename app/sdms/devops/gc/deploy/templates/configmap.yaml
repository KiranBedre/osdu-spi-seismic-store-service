apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Values.conf.appName | quote }}
  name: {{  printf "%s-config" .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
data:
  DES_SERVICE_HOST_COMPLIANCE: {{ .Values.data.legalHost | quote}}
  DES_SERVICE_HOST_ENTITLEMENT: {{ .Values.data.entitlementsHost | quote}}
  DES_SERVICE_HOST_STORAGE: {{ .Values.data.storageHost | quote}}
  DES_SERVICE_HOST_PARTITION: {{ .Values.data.partitionHost | quote}}
  ENTITLEMENT_BASE_URL_PATH: "/api/entitlements/v2"
  PORT: "5000"
  LOG_LEVEL: {{ .Values.data.logLevel | default .Values.global.logLevel | quote }}
  CLOUDPROVIDER: "gc"
  USER_ID_FROM_PROVIDER_API: "true"
  TENANT_JOURNAL_ON_DATA_PARTITION: "true"
  {{- if .Values.data.redisSdmsHost }}
  LOCKSMAP_REDIS_INSTANCE_ADDRESS: {{ .Values.data.redisSdmsHost | quote }}
  {{- else }}
  LOCKSMAP_REDIS_INSTANCE_ADDRESS: {{ printf "redis-%s" .Values.conf.appName | quote }}
  {{- end}}
  LOCKSMAP_REDIS_INSTANCE_PORT: {{ .Values.data.redisSdmsPort | quote }}
  LOCKSMAP_REDIS_INSTANCE_TLS_DISABLE: "true"
