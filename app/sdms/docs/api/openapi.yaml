    Filemetadata:
      type: object
      description: |
        Seismic-store specific descriptor of how the dataset is laid out in cloud
        storage. Used by client libraries to reconstruct multi-object datasets.
      properties:
        nObject:
          type: integer
          description: Number of physical objects that make up the dataset.
        totalSize:
          type: integer
          description: Total size of the dataset across all physical objects.
        objsize:
          type: integer
          description: Size of each individual physical object (except possibly the last one).
        sizeUnit:
          type: string
          description: Unit for objsize and totalSize (e.g. B, KB, MB, GB).
        tier_class:
          type: string
          readOnly: true
          description: |
            Read-only label reflecting the current storage tier of the dataset's
            underlying blobs (for example `Hot`, `Cool`, `Cold`, `Archive`). The
            service populates this field; it is never updated by a PATCH and any
            value supplied for it in a PATCH body is ignored. To change the
            storage tier use the `change_tier` field on `PATCH /dataset/...`
            (fire-and-forget) or the asynchronous `PUT /operation/change-tier`
            and poll `GET /operation/change-tier`.
    DatasetPatch:
      type: object
      description: |
        Request body for the PATCH dataset operation. At least one field is required
        unless the `close` query parameter is used. Most fields are independent, but:
          - `dataset_new_name` and `change_tier` may be combined in a single request;
            the rename is applied synchronously while the tier change is dispatched
            as a fire-and-forget background operation.
          - `filemetadata.tier_class` is read-only and is ignored if supplied.
      properties:
        dataset_new_name:
          type: string
          description: New name for the dataset (rename).
        metadata:
          type: object
          description: Generic information about the dataset stored as key value pairs.
        filemetadata:
          allOf:
            - $ref: "#/components/schemas/Filemetadata"
          description: |
            Seismic-store specific physical layout descriptor. The nested
            `tier_class` field is read-only and informational; supplying it in
            a PATCH body has no effect.
        change_tier:
          type: string
          writeOnly: true
          enum:
            - Hot
            - Cool
            - Cold
          description: |
            Actionable, write-only field that requests a storage-tier change for
            the dataset.

            Behavior:
              - **Fire-and-forget**: the API returns `200 OK` with the updated
                metadata as soon as the metadata patch succeeds, *before* the
                underlying cloud-storage tier transition has completed.
              - No operation id, no progress polling, no per-blob failure detail
                through this endpoint. Failures are visible only in server logs.
              - Honored only when `FEATURE_FLAG_ENABLE_CHANGE_TIER` is enabled;
                when disabled the request is rejected with
                `403 PERMISSION_DENIED`.
              - Write-only: the response body never echoes it back. The current
                tier of the dataset is exposed as the read-only
                `filemetadata.tier_class` field on the GET response.

            For tier changes that need progress tracking, use the change-tier
            operation (`PUT /operation/change-tier`) and poll its status with
            `GET /operation/change-tier`.
        last_modified_date:
          type: string
          description: Date when the dataset was last modified.
        gtags:
          type: array
          description: Array of tags associated with the dataset. After patching these
            tags, they can be used to filter the datasets.
          items:
            type: string
          default: []
        ltag:
          type: string
          description: Legal tag associated with the dataset.
        readonly:
          type: boolean
          description: True if the dataset is read only.
        status:
          type: string
          description: The status of the dataset (if set)
        seismicmeta:
          type: object
          description: Seismic metadata associated with the dataset which is used to create
            a data ecosystem storage record.
          properties:
            kind:
              type: string
            data:
              type: object
        openzgy_v1:
          $ref: "#/components/schemas/FileCollectionOpenZGY"
        segy_v1:
          $ref: "#/components/schemas/FileCollectionSEGY"
        acls:
          $ref: "#/components/schemas/Acls"
      example:
        dataset_new_name: dsx02
        metadata:
          f1: v1
          f2: v2
          f3: v3
        filemetadata:
          f1: v1
          f2: v2
          f3: v3
        last_modified_date: Thu Jul 16 2020 04:37:41 GMT+0000 (Coordinated Universal Time)
        gtags:
          - tag01
          - tag02
          - tag03
        ltag: legal-tag
        readonly: false
        seismicmeta:
          kind: slb:seistore:seismic2d:1.0.0
          legal:
            legaltags:
              - Slb-Private-USA-EHC
            otherRelevantDataCountries:
              - US
          data:
            msg: sample data
        openzgy_v1:
          data:
            Name: Dataset X221/15
            DatasetProperties:
              FileCollectionPath: s3://default_bucket/opendes/data/vds-dataset/
          id: "opendes:dataset--FileCollection.Slb.OpenZGY:5771c352-dc52-5d26-9351-2b8dbc9eb474"
          kind: "osdu:wks:dataset--FileCollection.Slb.OpenZGY:1.0.0"
        segy_v1:
          id: "osdu:dataset--FileCollection.SEGY:b47f793a-dc9c-5d11-8d59-6cc611a98926"
          kind: "osdu:wks:dataset--FileCollection.SEGY:1.0.0"
          data:
            Name: Dataset X221/15
            DatasetProperties:
              FileCollectionPath: s3://default_bucket/opendes/data/vds-dataset/
            SEGYRevision: rev 0
        acls:
          admins:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.admin@slb.p4d.cloud.slb-ds.com
          viewers:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.viewer@slb.p4d.cloud.slb-ds.com
