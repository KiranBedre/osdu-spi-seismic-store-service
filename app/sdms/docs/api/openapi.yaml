# ===========================================================================
# Endpoints Description
# ===========================================================================

openapi: 3.0.0
info:
  title: Seismic DMS Service
  version: 3.0.0
  description: Seismic Data Management APIs to store and manage seismic datasets .
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

# ===========================================================================
# Endpoints Paths Section
# ===========================================================================

servers:
  - url: "#{SDMS_PREFIX}#"

tags:
  - name: General
    description: General seismic store information
  - name: Dataset
    description: Dataset related seismic store endpoints
  - name: Utility
    description: Seismic store endpoints with additional features
  - name: Impersonation Token
    description: Generate Impersonation token
  - name: SubProject
    description: Subproject related seismic store endpoints
  - name: Tenant
    description: Register or retrieve a tenant
  - name: Users
    description: User authorization
  - name: Apps
    description: Application related seismic store endpoints
  - name: Operations
    description: Requests can handle datasets in bulk
  - name: Analytics
    description: Manage analytics job configurations and generated reports
paths:
  /svcstatus:
    get:
      summary: Seismic store service status (fast check).
      description: |-
        <ul>
          <li>Return the seismic store service status.</li>
          <li>No authentication required</li>
        </ul>
      security: []
      operationId: service-status
      tags:
        - General
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                type: string
                example: service OK

  /svcstatus/access:
    get:
      summary: Seismic store service access check.
      description: |-
        <ul>
          <li>Validates if the token audience is allowed</li>
          <li>Required roles: any authenticated caller</li>
        </ul>
      operationId: service-status-check
      tags:
        - General
      responses:
        "200":
          description: User token audience is allowed by seismic store service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /info:
    get:
      summary: Seismic store service info.
      description: |-
        <ul>
          <li>Return the seismic store service deployment information.</li>
          <li>No authentication required</li>
        </ul>
      security: []
      operationId: service-info
      tags:
        - General
      responses:
        "200":
          description: Service info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}:
    post:
      summary: Register a new dataset.
      description: |-
        <ul>
          <li>Register a new dataset in the seismic store.</li>
          <li>Required roles: subproject.admin</li>
        </ul>
      operationId: dataset-register
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - description: Legal tag of the dataset.
          in: header
          name: ltag
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetRegisterBody"
        description: Request body
      responses:
        "200":
          description: Registered dataset metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"

    get:
      summary: Retrieve the dataset metadata.
      description: |-
        <ul>
          <li>Return the dataset metadata from seismic store.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin, subproject.viewer: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin, dataset.viewer: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-get
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
        - description: Include the seismic storage metadata record if it exists.
          in: query
          name: seismicmeta
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/TranslateUserInfo"
        - description: Retrieve a specific version of the seismic storage metadata record
          in: query
          name: record-version
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Metadata of the dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a dataset.
      description: |-
        <ul>
          <li>Delete a dataset in the seismic store.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-delete
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: The resource was deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Patch the dataset metadata.
      description: |
        <ul>
          <li>Update the dataset meta information in the seismic store or close (unlock) the dataset. If the endpoint is used without the close parameter, at least one body field is required or the endpoint will return an error.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
          <li>Patchable fields:
            <ul>
              <li><b>dataset_new_name:</b> new name to use for the dataset (rename).</li>
              <li><b>filemetadata:</b> Seismic-store specific field describing how the physical data is stored in cloud storage (GCS / Azure Container / S3). Primarily used by client libraries to reconstruct the dataset. Example for a truncated dataset of N objects of 64 MB each: <pre>{nObject: N, totalSize: 1024, objsize: 64, sizeUnit: MB}</pre>
                <ul>
                  <li>The nested field <b>filemetadata.tier_class</b> is <b>read-only</b>. Any value supplied for it is dropped when the patch is applied, and it cannot be used on its own to trigger a tier change.</li>
                </ul>
              </li>
              <li><b>change_tier:</b> Requests a storage-tier change for the dataset. Accepted values: <code>Hot</code>, <code>Cool</code>, <code>Cold</code>. See the NOTE below and the feature-flag and validation sections for behavior details.</li>
              <li><b>gtags:</b> Upsert tags to an existing dataset metadata. If the dataset metadata already has gtags, the new gtags are appended to the existing list.</li>
              <li><b>ltag:</b> Update the existing legalTag value.</li>
              <li><b>readonly:</b> Update the dataset mode to readonly (true) or to read/write (false).</li>
              <li><b>status:</b> Update the dataset status.</li>
            </ul>
          </li>
          <li><b>Feature flags affecting this endpoint:</b>
            <ul>
              <li><b>FEATURE_FLAG_ENABLE_CHANGE_TIER</b> &mdash; when disabled, any PATCH supplying <b>change_tier</b> is rejected with <code>403 PERMISSION_DENIED</code>.</li>
              <li><b>FEATURE_FLAG_SEISMICMETA_STORAGE</b> &mdash; controls persistence of the storage-record body field (<b>seismicmeta</b>, or one of the supported alternates such as <b>openzgy_v1</b> / <b>segy_v1</b>). When disabled, the field is still validated and reflected in the dataset metadata, but the record is <i>not</i> persisted to the underlying storage service.</li>
            </ul>
          </li>
          <li><b>Validation rules for <code>change_tier</code> and <code>filemetadata.tier_class</code>:</b>
            <ul>
              <li>If only <b>change_tier</b> is supplied, the tier change proceeds and the response <b>filemetadata.tier_class</b> reflects the requested tier.</li>
              <li>If both <b>change_tier</b> and <b>filemetadata.tier_class</b> are supplied and they have the <i>same</i> value, the tier change proceeds.</li>
              <li>If both are supplied and the values <i>differ</i>, the request is rejected with <code>400 BAD_REQUEST</code>.</li>
              <li>If only <b>filemetadata.tier_class</b> is supplied (without <b>change_tier</b>), the value is dropped when copying <b>filemetadata</b> to the stored record &mdash; no tier change is triggered. To change the tier, use <b>change_tier</b>.</li>
            </ul>
          </li>
          <li><b>NOTE:</b> <code>last_modified_date</code> is updated automatically on every metadata change made through this endpoint.</li>
          <li><b>NOTE:</b> the <b>change_tier</b> field on this endpoint is fire-and-forget. A successful <code>200 OK</code> indicates that the metadata patch succeeded; it does <i>not</i> indicate that the underlying cloud-storage tier transition has completed. After the call, issue a <code>GET</code> on the dataset to observe the eventual <b>filemetadata.tier_class</b>.</li>
          <li><b>Recommended approach for tier changes:</b> for production workloads that need an observable, long-running operation with progress tracking, use the change-tier operation (<code>PUT /operation/change-tier</code>) and poll its status with <code>GET /operation/change-tier</code> instead of the fire-and-forget <b>change_tier</b> field on this endpoint.</li>
        </ul>
      operationId: dataset-patch
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
        - description: Non null sbit value of the dataset. Using this value here will close
            the dataset.
          in: query
          name: close
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetPatch"
            examples:
              rename:
                summary: Rename a dataset
                description: |
                  Rename only. No other side-effects. Returns the updated dataset
                  metadata synchronously.
                value:
                  dataset_new_name: dataset-renamed
              tags:
                summary: Add gtags to a dataset
                description: |
                  Appends `gtags` to the existing list (upsert semantics).
                value:
                  gtags:
                    - basin-north-sea
                    - vintage-2024
              legalTag:
                summary: Update legal tag
                value:
                  ltag: opendes-public-usa-dataset-1
              readonlyToggle:
                summary: Mark dataset readonly
                value:
                  readonly: true
              changeTier:
                summary: Request a storage-tier change (fire-and-forget)
                description: |
                  The `change_tier` field is honored only when the
                  `FEATURE_FLAG_ENABLE_CHANGE_TIER` server flag is enabled;
                  otherwise the request is rejected with `403 PERMISSION_DENIED`.
                  The API returns `200 OK` as soon as the metadata patch
                  succeeds; the underlying cloud-storage tier transition runs in
                  the background with no operation id and no progress polling.
                  For tier changes that need progress tracking, use the
                  change-tier operation: `PUT /operation/change-tier`.
                value:
                  change_tier: Cool
              renameAndChangeTier:
                summary: Combined rename + tier change
                description: |
                  Rename is applied synchronously; tier change is dispatched
                  fire-and-forget as described above.
                value:
                  dataset_new_name: dataset-renamed
                  change_tier: Cold
        description: Request body
      responses:
        "200":
          description: |
            Metadata of the patched dataset. Note that when `change_tier` is
            supplied, this response is returned *before* the cloud-storage tier
            transition has completed; the response body reflects the metadata
            patch only, not the eventual tier state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/lock:
    put:
      summary: Acquire a lock for a dataset id.
      description: |
        <ul>
          <li>Open a dataset for read or write and lock its state.</li>
          <li>Required roles open lock for write:
            <ul>
              <li>subproject.admin: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
          <li>Required roles open lock for read:
            <ul>
              <li>subproject.admin, subproject.viewer: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin, dataset.viewer: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-lock
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
        - description: Type of the lock which can be set to 'read' (default) or 'write'.
          in: query
          name: openmode
          required: false
          schema:
            type: string
        - description: Session identifier issued for a previous write lock acquisition
            operation.
          in: query
          name: wid
          required: false
          schema:
            type: number
      responses:
        "200":
          description: "Acquired a lock and the return value is the dataset metadata with session identifier stored in the 'sbit' attribute."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/unlock:
    put:
      summary: Remove the lock associated with a dataset id.
      description: |
        <ul>
          <li>Removes the lock for a dataset id.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-unlock
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - description: Hierarchical path for the dataset.
          in: query
          name: path
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Removed the lock value associated with dataset id.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/permission:
    get:
      summary: Retrieve the access permissions of a user on a dataset id.
      description: |
        <ul>
          <li>Retrieve the access permission of a user on a dataset.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin, subproject.viewer: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin, dataset.viewer: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-permission
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - description: Hierarchical path for the dataset.
          in: query
          name: path
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: User access permission on the dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPermission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/ctagcheck:
    get:
      summary: "Validate if a dataset ctag matches the pre-existing ctag in metadata catalog."
      description: |-
        <ul>
          <li>Check if the provided dataset cTag match the one stored in the metadata catalog.</li>
          <li>Required roles: subproject.admin, subproject.viewer</li>
        </ul>
      operationId: dataset-ctag-check
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
        - description: Ctag to be validated.
          in: query
          name: ctag
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Return true if the ctag is valid or false if it is invalid.
          content:
            application/json:
              schema:
                type: boolean
                example: "true"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/gtags:
    put:
      summary: Upsert tags to a dataset.
      description: |
        <ul>
          <li>Upsert tags to an existing dataset metadata. If the dataset metadata already has gtags, then  new gtags are appended to this list.</li>
          <li>Required roles:
            <ul>
              <li>subproject.admin: if the applied subproject policy is 'uniform'</li>
              <li>dataset.admin: if the applied subproject policy is 'dataset'</li>
            </ul>
          </li>
        </ul>
      operationId: dataset-add-tag
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetPath"
        - $ref: "#/components/parameters/DatasetId"
        - description: Gtags array list.
          in: query
          name: gtag
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
              default: tag1
      responses:
        "200":
          description: Gtags were upserted to the dataset metadata.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/dataset/{datasetid}/size:
    post:
      summary: Compute and retrieve the size of a dataset and the date of when the size
        was computed
      description: |
        <ul>
        <li>Compute and retrieve the size of a dataset and the date of when the size was computed.</li>
        <li>Required roles: subproject.admin</li></ul>
      operationId: dataset-size-post
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - $ref: "#/components/parameters/DatasetId"
        - description: Hierarchical path of the dataset.
          in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Size of the dataset and the date of when the size was computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSize"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/size:
    get:
      summary: Retrieve the size of datasets
      description: |
        <ul>
        <li>Required roles: subproject.viewer</li></ul>
      operationId: dataset-size-get
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - description: Name of the dataset.
          in: query
          name: datasetid
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/DatasetPath"
      responses:
        "200":
          description: Size of the dataset and the date of when the size was computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputedSize"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}/readdsdirfulllist:
    get:
      summary: Content list.
      description: |
        <ul>
        <li>List datasets and sub-directories for a directory path.</li>
        <li>Required roles: subproject.admin, subproject.viewer</li></ul>
      operationId: dataset-read-directory
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubProjectId"
        - description: The hierarchy path.
          in: query
          name: path
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The list of datasets and directories in the requested directory path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetAndDirectories"

  /dataset/tenant/{tenantid}/subproject/{subprojectid}:
    post:
      summary: Get the list of datasets in a subproject.
      description: |
        <ul>
          <li>Return the list of datasets in a sub-project. The list can be filtered by gtags. Support pagination.</li>
          <li>Required roles: subproject.admin, subproject.viewer</li>
        </ul>
      operationId: dataset-list-post
      tags:
        - Dataset
      parameters:
        - $ref: "#/components/parameters/ImpersonationTokenContext"
        - $ref: "#/components/parameters/TenantId"
