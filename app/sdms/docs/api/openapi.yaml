          admins:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.admin@slb.p4d.cloud.slb-ds.com
            - data.sdms.tenant.subproject.1f1tr7fe-fb0e-402a-b725-606723e5356n.admin@slb.p4d.cloud.slb-ds.com
          viewers:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.viewer@slb.p4d.cloud.slb-ds.com
    SubProject:
      type: object
      required:
        - name
        - tenant
        - storage_class
        - storage_location
        - ltag
        - access_policy
      properties:
        name:
          type: string
          description: Name of the subproject.
        tenant:
          type: string
          description: Name of the tenant.
        storage_class:
          type: string
          description: Storage class for the bucket.
        storage_location:
          type: string
          description: Storage location for the bucket.
        ltag:
          type: string
          description: Legal tag for the subproject.
        access_policy:
          type: string
          description: Access policy for the subproject.
          default: uniform
          enum:
            - uniform
            - dataset
        acls:
          $ref: "#/components/schemas/Acls"
      example:
        name: spx01
        tenant: tnx01
        storage_class: MULTI_REGIONAL
        storage_location: US
        admin: test@email
        ltag: Slb-Private-USA-EHC
        gcs_bucket: subproject-bucket
        acls:
          admins:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.admin@slb.p4d.cloud.slb-ds.com
          viewers:
            - data.sdms.tenant.subproject.1b1417e5-fb0e-402a-b725-606723e50b76.viewer@slb.p4d.cloud.slb-ds.com
    TenantCreateBody:
      type: object
      required:
        - gcpid
        - esd
        - default_acls
      properties:
        gcpid:
          type: string
          description: Google cloud project id associated with the tenant. For other
            providers, name of the data partition.
        esd:
          type: string
          description: Entitlements group Sub Domain (ESD). For instance, if the
            entitlements group is
            users.datalake.viewers@{datapartition}.{domain}.com, the esd value
            is {datapartition}.{domain}.com. It must start with the name of the
            data partition.
        default_acls:
          type: string
          description: Entitlements authorization group to manage tenant administrators.
      example:
        gcpid: datapartition
        esd: "{datapartition}.{domain}.com"
        default_acls: users.datalake.admins@{datapartition}.{domain}.com
    Tenant:
      type: object
      required:
        - name
        - esd
        - gcpid
        - default_acls
      properties:
        name:
          type: string
          description: Name of the tenant.
        esd:
          type: string
          description: Entitlements group Sub Domain (ESD). For instance, if the
            entitlements group is
            users.datalake.viewers@{datapartition}.{domain}.com, the esd value
            is {datapartition}.{domain}.com. It has to start with the name of
            the data partition.
        gcpid:
          type: string
          description: Google cloud project id associated with the tenant. For other
            providers, name of the data partition.
        default_acls:
          type: string
          description: Entitlements authorization group to manage tenant administrators.
      example:
        name: datapartition
        esd: "{datapartition}.{domain}.com"
        gcpid: datapartition
        default_acls: users.datalake.admins@{datapartition}.{domain}.com
    UserAddRequest:
      type: object
      required:
        - email
        - path
        - group
      properties:
        email:
          type: string
          description: Email address of the user. Note that this field is used as a
            principal identifier for entitlements-svc and can be configured using the
            env variable USER_ID_CLAIM_FOR_ENTITLEMENTS_SVC in the Seismic DMS
            runtime.
        path:
          type: string
          description: Seismic store path in the format sd://tenant/subproject.
        group:
          type: string
          description: Role to be assigned to the user.
          enum:
            - viewer
            - admin
      example:
        email: test@slb.com
        path: sd://slb/test_project
        group: admin
    UserRoles:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          description: Array of arrays with each array containing subproject and role of
            the user for the subproject.
          items:
            type: array
            items:
              type: string
            example:
              - /spx01
              - admin
          example:
            - - /spx01
              - admin
            - - /spx02
              - viewer
    LsDatasets:
      type: array
      description: Array of directories and datasets inside a subproject.
      items:
        type: string
      example:
        - folderA/
        - folderB/
        - dataset01
        - dataset02
        - dataset03
    LsPaginatedDatasets:
      type: object
      required:
        - datasets
        - nextPageCursor
      properties:
        datasets:
          type: array
          description: Array of datasets inside the subproject.
          items:
            type: string
        nextPageCursor:
          type: string
          description: Next cursor for pagination.
      example:
        datasets:
          - folderA/
          - folderB/
          - dataset01
        nextPageCursor: abc1234
    PaginatedDatasets:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        nextPageCursor:
          type: string
          example: next-page-token-3rt431v41-4515351
    DatasetSize:
      type: object
      required:
        - computed_size
        - computed_size_date
      properties:
        computed_size:
          type: number
          description: The size of the dataset in bytes..
        computed_size_date:
          type: string
          description: The date of when the dateset size was computed.
      example:
        computed_size: "35461"
        computed_size_date: Thu Mar 16 2023 16:16:40 GMT-0500 (Central Daylight Time)
    ComputedSize:
      type: object
      required:
        - size_bytes
        - dataset_count
      properties:
        size_bytes:
          type: number
          description: The size of the datasets in bytes.
        dataset_count:
          type: number
          description: The number of datasets in the path (including nested folders).
      example:
        size_bytes: 35461
        dataset_count: 2
    Operation:
      type: object
      required:
        - operation_id
      properties:
        operation_id:
          type: string
          description: Operation id of the operation job.
      example:
        operation_id: 9a8f2e31-4c67-4b8a-b123-abcdef123456
    OperationStatus:
      type: object
      required:
        - operation_id
        - status
      properties:
        operation_id:
          type: string
          description: Operation id of the operation job.
        created_at:
          type: string
          description: Time when the operation was initiated.
        created_by:
          type: string
          description: User who initiated the operation job.
        last_updated_at:
          type: string
          description: Time when the operation status was last updated.
        status:
          type: string
          description: Status of the operation job.
        dataset_cnt:
          type: integer
          description: Total number of datasets to process.
        completed_cnt:
          type: integer
          description: Number of datasets correctly processed.
        failed_cnt:
          type: integer
          description: Number of datasets which processing failed.
      example:
        operation_id: c3d282e6-e7d1-40d8-8ac2-edc15b6d174c
        created_at: string
        created_by: string
        last_updated_at: string
        status: Completed
        dataset_cnt: 1000
        completed_cnt: 997
        failed_cnt: 3
    ChangeTierOperationStatus:
      type: object
      required:
        - operation_id
        - status
      properties:
        operation_id:
          type: string
          description: Operation id of the operation job.
        created_at:
          type: string
          description: Time when the operation was initiated.
        created_by:
          type: string
          description: User who initiated the operation job.
        last_updated_at:
          type: string
          description: Time when the operation status was last updated.
        status:
          type: string
          description: |
            Status of the operation job. Possible values:
            - **NotStarted**: The operation has been accepted and is waiting to be processed.
            - **InProgress**: The operation is currently being processed.
            - **Completed**: The operation has finished successfully with all datasets processed.
            - **CompletedWithErrors**: The operation has finished but some datasets failed to process.
          enum:
            - NotStarted
            - InProgress
            - Completed
            - CompletedWithErrors
        dataset_cnt:
          type: integer
          description: Total number of datasets to process.
        completed_cnt:
          type: integer
          description: Number of datasets correctly processed.
        failed_cnt:
          type: integer
          description: Number of datasets which processing failed.
        target_tier:
          type: string
          description: |
            Target storage tier for change-tier operations. Supported tiers:
            - **Hot**: Optimized for frequent access. Highest storage cost, lowest access cost.
            - **Cool**: Optimized for infrequent access. Lower storage cost, higher access cost.
            - **Cold**: Optimized for rare access. Lowest storage cost, highest access cost.
          enum:
            - Hot
            - Cool
            - Cold
        failed_datasets:
          type: array
          description: Array of failed datasets with error details. Only included when show_details=true and failed_cnt > 0.
          items:
            $ref: "#/components/schemas/DatasetFailure"
        cursor:
          type: string
          description: Base64 URL-safe encoded cursor to retrieve the next page of failed datasets. Present only if there are more failures to fetch.
      example:
        operation_id: 9a8f2e31-4c67-4b8a-b123-abcdef123456
        created_at: '2026-03-10T08:00:00Z'
        created_by: user_oid
        last_updated_at: '2026-03-10T08:45:00Z'
        status: CompletedWithErrors
        dataset_cnt: 2000
        completed_cnt: 1994
        failed_cnt: 6
        target_tier: Cool
        failed_datasets:
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-001
            error: Failed to change tier for 12 blob(s)
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-002
            error: 'Access denied: user is not authorized to modify this dataset (ACL validation failed)'
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-003
            error: Failed to acquire lock
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-004
            error: Dataset has no associated storage location
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-005
            error: Dataset storage location has invalid format
          - sdpath: sd://opendes/project-alpha/seismic/survey-2024-006
            error: Tier changed but metadata update failed after retries
        cursor: ZXlKamIyNTBhVzUxWVhScGIyNVViMnRsYmlJNkltVjRZVzF3YkdVaWZRPT0
    DatasetFailure:
      type: object
      required:
        - sdpath
        - error
      properties:
        sdpath:
          type: string
          description: The SDMS path of the dataset that failed (format sd://tenant/subproject/path/dataset).
        error:
          type: string
          description: Error message describing why the dataset operation failed.
      example:
        sdpath: sd://opendes/project-alpha/seismic/survey-2024-001
        error: Failed to change tier for 12 blob(s)
    AnalyticsJobInput:
      type: object
      required:
        - statistics
      properties:
        name:
          type: string
          description: "Subproject name. If empty or omitted, the analytics job configuration is created at the tenant level."
        statistics:
          type: string
          description: "Comma-separated statistics codes. Supported values: OB=object count, SZ=total size, TH=hot tier size, TC=cool tier size, TD=cold tier size, TA=archive tier size, TU=unknown tier size, HN=touched object count, HS=touched object size, CB=created_by, CT=creation time, LA=last accessed time, LM=last modified time, LT=last modified tier time. Example: OB,SZ."
        first_execution:
          type: integer
          minimum: 1
          maximum: 7
          description: "Requested weekday for the first execution using the current implementation mapping (1=Sunday, 2=Monday, ..., 7=Saturday). The service converts this value to the next scheduled UTC timestamp before persisting and returning the schedule. Defaults to today."
        freq_execution:
          type: integer
          minimum: 1
          description: "Number of days between analytics job executions. Defaults to 7 (weekly)."
      example:
        name: "north-sea-survey"
        statistics: "SZ"
        first_execution: 7
        freq_execution: 7
    AnalyticsJob:
      type: object
      properties:
        name:
          type: string
          description: "Subproject name for a subproject-level configuration, or tenant partition ID for a tenant-level configuration."
        type:
          type: string
          description: "Scope of the analytics job configuration."
          enum:
            - subproject
            - partition
        statistics:
          type: string
          description: "Comma-separated metric codes to include in the analytics report."
        first_execution:
          type: integer
          format: int64
          description: "UTC timestamp (milliseconds) of the next planned execution. This value is computed from AnalyticsJobInput.first_execution when the analytics job configuration is created or updated."
        freq_execution:
          type: integer
          description: "Number of days between analytics job executions."
      example:
        name: "north-sea-survey"
        type: "subproject"
        statistics: "sz,th"
        first_execution: 1775260800000
        freq_execution: 1
    AnalyticsConnectionString:
      type: object
      required:
        - access_token
        - expires_in
        - token_type
      properties:
        access_token:
          type: string
          description: "Storage access token or SAS connection string for downloading analytics reports."
        expires_in:
          type: number
          description: "Expiration time for the returned storage credentials in seconds."
        token_type:
          type: string
          description: "Credential type returned by the cloud provider, for example Bearer or SasUrl."
      example:
        access_token: "sv=2021-06-08&ss=b&srt=sco&sp=rl&se=..."
        expires_in: 3599
        token_type: "SasUrl"
    RestoreRequest:
      type: object
      required:
        - sdPath
        - restorePointInTime
      properties:
        sdPath:
          type: string
          description: "The dataset path in sd:// format (sd://tenant/subproject/path/dataset)."
        restorePointInTime:
          type: string
          format: date-time
          description: "ISO-8601 timestamp of the point in time to restore to. Must be in the past and within the configured retention window (SDMS_RESTORE_MAX_DAYS)."
      example:
        sdPath: "sd://opendes/test-subproject/surveys/dataset1"
        restorePointInTime: "2026-07-10T08:30:00.000Z"
    RestoreAccepted:
      type: object
      required:
        - operation_id
        - statusUrl
      properties:
        operation_id:
          type: string
          description: "Unique identifier of the restore operation. Use it to poll the status endpoint."
        statusUrl:
          type: string
          description: "Relative URL to poll for the restore operation status."
      example:
        operation_id: "c3d282e6-e7d1-40d8-8ac2-edc15b6d174c"
        statusUrl: "/seistore-svc/api/v3/operation/restore/c3d282e6-e7d1-40d8-8ac2-edc15b6d174c"
    RestoreOperationStatus:
      type: object
      required:
        - operationId
        - status
        - sdPath
        - restorePointInTime
      properties:
        operationId:
          type: string
          description: "Unique identifier of the restore operation."
        status:
          type: string
          description: "Current status of the restore operation."
          enum: [Enqueued, InProgress, Succeeded, Failed, Rejected]
        sdPath:
          type: string
          description: "The dataset path being restored (sd:// format)."
        restorePointInTime:
          type: string
          format: date-time
          description: "The point in time the dataset is being restored to."
        tenant:
          type: string
          description: "Tenant of the dataset."
        subproject:
          type: string
          description: "Subproject of the dataset."
        createdBy:
          type: string
          description: "Identifier of the user who initiated the restore."
        errorDetails:
          type: string
          description: "Human-readable reason the operation was rejected or failed. Present only for Rejected/Failed operations."
        startedAt:
          type: string
          format: date-time
          description: "When the restore operation was created."
        lastUpdatedAt:
          type: string
          format: date-time
          description: "When the operation status was last updated."
        completedAt:
          type: string
          format: date-time
          description: "When the operation reached a terminal state, if it has finished."
      example:
        operationId: "c3d282e6-e7d1-40d8-8ac2-edc15b6d174c"
        status: "Rejected"
        sdPath: "sd://opendes/test-subproject/surveys/dataset1"
        restorePointInTime: "2026-07-10T08:30:00.000Z"
        createdBy: "00000000-0000-0000-0000-000000000000"
        errorDetails: "Restore rejected: the dataset is currently locked by another in-progress write operation. Wait for that operation to finish and release the lock, then retry this restore."
        lastUpdatedAt: "2026-07-15T10:00:07.000Z"