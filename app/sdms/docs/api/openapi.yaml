  /operation/restore:
    post:
      summary: Trigger a point-in-time restore operation for a dataset. (Preview)
      description: |-
        <ul>
          <li><b>Preview:</b> This feature is available on request for the Standard SKU. To enable it, create a support request in the Azure portal for Azure Data Manager for Energy. See the <a href="https://learn.microsoft.com/en-us/azure/energy-data-services/faq-energy-data-services#how-do-i-raise-a-support-request-for-azure-data-manager-for-energy">official support guidance</a>.</li>
          <li><b>Description:</b> Initiates a point-in-time restore for the specified dataset. The request is validated synchronously, then the restore job is enqueued for asynchronous processing and the endpoint returns immediately with an operation id to poll. The dataset metadata and its blob storage are restored to the state they were in at <code>restorePointInTime</code>.</li>
          <li><b>Required role:</b> Subproject admin (write authorization on the target subproject).</li>
          <li><b>Concurrency:</b> Only one restore operation can be in progress per data partition at a time.</li>
          <li><b>Constraints:</b> <code>restorePointInTime</code> must be in the past, within the configured retention window (<code>SDMS_RESTORE_MAX_DAYS</code>), and after the dataset creation time.</li>
          <li><b>Note:</b> A <code>202</code> only means the request was accepted and enqueued. The dataset write-lock check and the actual restore run asynchronously; poll <code>GET /operation/restore/{operationId}</code> for the terminal outcome (including a rejection reason in <code>errorDetails</code>).</li>
        </ul>
      operationId: operation-restore-post
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Restore operation accepted and enqueued for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreAccepted"
        "400":
          description: |-
            Bad Request. Possible reasons:
            <ul>
              <li>sdPath is required and must be a string.</li>
              <li>Invalid sdPath format (must be sd://tenant/subproject/path/dataset).</li>
              <li>restorePointInTime is required and must be a valid ISO-8601 date.</li>
              <li>restorePointInTime must be in the past.</li>
              <li>restorePointInTime must be within the configured retention window.</li>
              <li>restorePointInTime must be after the dataset creation time.</li>
            </ul>
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            Forbidden. Possible reasons:
            <ul>
              <li>The restore feature flag is disabled.</li>
              <li>The user is not registered in the data partition.</li>
              <li>The user does not have the subproject admin role.</li>
            </ul>
        "404":
          description: The dataset does not exist and has no archived state to restore from.
        "409":
          description: |-
            Conflict. A restore operation is already in progress for this data partition;
            only one restore can run at a time per data partition.
        "503":
          description: |-
            Service Unavailable. Possible reasons:
            <ul>
              <li>Storage backup retention is not configured for this instance.</li>
              <li>The distributed lock service (Redis) is temporarily unavailable.</li>
            </ul>

  /operation/restore/{operationId}:
    get:
      summary: Get the status of a restore operation. (Preview)
      description: |-
        <ul>
          <li><b>Preview:</b> This feature is available on request for the Standard SKU. To enable it, create a support request in the Azure portal for Azure Data Manager for Energy. See the <a href="https://learn.microsoft.com/en-us/azure/energy-data-services/faq-energy-data-services#how-do-i-raise-a-support-request-for-azure-data-manager-for-energy">official support guidance</a>.</li>
          <li><b>Description:</b> Retrieves the current status of a previously initiated restore operation, including its terminal outcome and, for rejected or failed operations, a human-readable <code>errorDetails</code> message.</li>
          <li><b>Required role:</b> Registered user in the data partition.</li>
        </ul>
      operationId: operation-restore-status
      tags:
        - Operations
      parameters:
        - description: "The restore operation id returned from POST /operation/restore."
          in: path
          name: operationId
          required: true
          schema:
            type: string
        - description: "Data partition id."
          in: header
          name: data-partition-id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restore operation status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreOperationStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No restore operation was found for the given operationId.

  # =========================================================================
  # Analytics Endpoints
  # =========================================================================

  /analytics/job:
    get:
      summary: List all analytics job configurations.
      description: |-
        <ul>
          <li>Description: List all analytics job configurations. Each configuration defines which report metrics are generated and how often reports are produced. Tenant admins see all configurations; subproject admins see only their subproject configurations.</li>
          <li>Roles: tenant.admin, data.manager, or subproject.admin</li>
        </ul>
      operationId: analytics-list-schedules
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/DataPartitionId"
      responses:
        "200":
          description: List of analytics job configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsJob"
              example:
                - name: "north-sea-survey"
                  type: "subproject"
                  statistics: "sz,th"
                  first_execution: 1775260800000
                  freq_execution: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Create or update an analytics job configuration.
      description: |-
        <ul>
          <li>Description: Create or update an analytics job configuration. The configuration defines which metrics to include in the analytics report and how often the job runs. The request body must be a single-element array. If the element name is empty, it creates a tenant-level configuration; otherwise it creates a subproject-level configuration.</li>
          <li>The request field <code>first_execution</code> is a weekday selector (1-7). The response field <code>first_execution</code> is the computed next execution time in UTC milliseconds.</li>
          <li>Roles: tenant.admin or data.manager (tenant-level configuration), subproject.admin (subproject-level configuration)</li>
        </ul>
      operationId: analytics-create-schedule
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/DataPartitionId"
      requestBody:
        required: true
        description: Single-element array containing the analytics job configuration.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AnalyticsJobInput"
              minItems: 1
              maxItems: 1
            example:
              - name: "north-sea-survey"
                statistics: "SZ"
                first_execution: 7
                freq_execution: 7
      responses:
        "200":
          description: Analytics job configuration created or updated successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/job/{subprojectid}:
    get:
      summary: List available analytics reports for a subproject.
      description: |-
        <ul>
          <li>Description: List available analytics report files for a specific subproject.</li>
          <li>Roles: subproject.admin, tenant.admin, or data.manager</li>
        </ul>
      operationId: analytics-list-reports
      tags:
        - Analytics
      parameters:
        - description: Name of the subproject.
          in: path
          name: subprojectid
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/DataPartitionId"
        - description: "Filter reports by date. Supported formats: YYYY, YYYY-MM, or YYYY-MM-DD."
          in: query
          name: filter-date
          required: false
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
        - description: "Extension appended to the analytics container name."
          in: query
          name: extension
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of available report blob names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - "2026/03/28/report.csv"
                - "2026/03/29/report.csv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete the analytics job configuration for a subproject.
      description: |-
        <ul>
          <li>Description: Delete the analytics job configuration for a specific subproject.</li>
          <li>Roles: subproject.admin, tenant.admin, or data.manager</li>
        </ul>
      operationId: analytics-delete-schedule
      tags:
        - Analytics
      parameters:
        - description: Name of the subproject.
          in: path
          name: subprojectid
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/DataPartitionId"
      responses:
        "200":
          description: Analytics job configuration deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/job/{subprojectid}/connection-string:
    get:
      summary: Get download connection string for subproject analytics reports.
      description: |-
        <ul>
          <li>Description: Generate storage credentials to download analytics report files for a subproject.</li>
          <li>Roles: subproject.admin, tenant.admin, or data.manager</li>
        </ul>
      operationId: analytics-report-download-connection-string
      tags:
        - Analytics
      parameters:
        - description: Name of the subproject.
          in: path
          name: subprojectid
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/DataPartitionId"
        - description: "Filter reports by date. Supported formats: YYYY, YYYY-MM, or YYYY-MM-DD."
          in: query
          name: filter-date
          required: false
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
        - description: "Extension appended to the analytics container name."
          in: query
          name: extension
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Storage credentials for downloading reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsConnectionString"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/tenant/job:
    get:
      summary: List available analytics reports for the tenant.
      description: |-
        <ul>
          <li>Description: List available analytics report files across the entire tenant.</li>
          <li>Roles: tenant.admin or data.manager</li>
        </ul>
      operationId: analytics-list-reports-tenant
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/DataPartitionId"
        - description: "Filter reports by date. Supported formats: YYYY, YYYY-MM, or YYYY-MM-DD."
          in: query
          name: filter-date
          required: false
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
        - description: "Extension appended to the analytics container name."
          in: query
          name: extension
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of available report blob names for the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Delete the tenant-level analytics job configuration.
      description: |-
        <ul>
          <li>Description: Delete the tenant-level analytics job configuration.</li>
          <li>Roles: tenant.admin or data.manager</li>
        </ul>
      operationId: analytics-delete-schedule-tenant
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/DataPartitionId"
      responses:
        "200":
          description: Tenant-level analytics job configuration deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/tenant/job/connection-string:
    get:
      summary: Get download connection string for tenant analytics reports.
      description: |-
        <ul>
          <li>Description: Generate storage credentials to download analytics report files at the tenant level.</li>
          <li>Roles: tenant.admin or data.manager</li>
        </ul>
      operationId: analytics-report-download-connection-string-tenant
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/DataPartitionId"
        - description: "Filter reports by date. Supported formats: YYYY, YYYY-MM, or YYYY-MM-DD."
          in: query
          name: filter-date
          required: false
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
        - description: "Extension appended to the analytics container name."
          in: query
          name: extension
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Storage credentials for downloading tenant reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsConnectionString"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# ===========================================================================
# Components Section
# ===========================================================================

security:
  - bearer: []
components:
  # =========================================================================
  # Reusable Parameters
  # =========================================================================
  parameters:
    TenantId:
      description: Name of the tenant.
      in: path
      name: tenantid
      required: true
      schema:
        type: string
    SubProjectId:
      description: Name of the subproject.
      in: path
      name: subprojectid
      required: true
      schema:
        type: string
    DatasetId:
      description: Name of the dataset.
      in: path
      name: datasetid
      required: true
      schema:
        type: string
    ImpersonationTokenContext:
      description: "The impersonation token context (required only with impersonation token credentials)"
      in: header
      name: impersonation-token-context
      required: false
      schema:
        type: string
        default: ""
    DataPartitionId:
      description: "Data partition identifier."
      in: header
      name: data-partition-id
      required: true
      schema:
        type: string
    DatasetPath:
      description: Hierarchical path of the dataset.
      in: query
      name: path
      required: false
      schema:
        type: string
    TranslateUserInfo:
      description: Translate the user-id to a more human readable user info.
      name: translate-user-info
      in: query
      schema:
        type: boolean
        enum:
          - true
          - false
        default: true

  # =========================================================================
  # Reusable Responses
  # =========================================================================
  responses:
    BadRequest:
      description: Bad request.
    Unauthorized:
      description: Unauthorized.
    Forbidden:
      description: Forbidden.
    NotFound:
      description: Not found.
    Gone:
      description: |
        Gone. The requested API is deprecated and no longer available.
    Conflict:
      description: Conflict.
    Locked:
      description: |
        Locked. The error message contains the Reason in the form <b>[RCODE:REASON(2-char-code)TTL(sec-number)]</b>. Possible Reasons code are: <ul>
        <li>WL (Write Locked).</li>
        <li>RL (Read Locked).</li>
        <li>CL (Cannot be Locked).</li>
        <li>UL (Cannot be Unlocked).</ul>
        For example the reason code <b>[RCODE:RL3600]</b> indicates the dataset is Read Locked with a TTL of 3600 seconds.

  # =========================================================================
  # Reusable Request Bodies
  # =========================================================================
  requestBodies:
    DatasetCheckList:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DatasetCheckList"
      description: Request body
      required: true

  # =========================================================================
  # Security Schemes
  # =========================================================================
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # =========================================================================
  # Schemas
  # =========================================================================
  schemas:
    # -----------------------------------------------------------------------
    # Shared / reusable sub-schemas (extracted from inline definitions)
    # -----------------------------------------------------------------------
    Acls:
      type: object
      description: ACLs with admin groups and viewer groups.
      properties:
        admins:
          type: array
          items:
            type: string
        viewers:
          type: array
          items:
            type: string

    AccessControlList:
      additionalProperties: false
      description: The access control tags associated with this entity.
      properties:
        owners:
          description: The list of owners of this data record.
          items:
            pattern: ^[a-zA-Z0-9_+&*-]+(?:\.[a-zA-Z0-9_+&*-]+)*@(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,7}$
            type: string
          title: List of Owners
          type: array
        viewers:
          description: The list of viewers to which this data record is accessible.
          items:
            pattern: ^[a-zA-Z0-9_+&*-]+(?:\.[a-zA-Z0-9_+&*-]+)*@(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,7}$
            type: string
          title: List of Viewers
          type: array
      required:
        - owners
        - viewers
      title: Access Control List
      type: object

    LegalParentList:
      additionalProperties: false
      description: A list of entity IDs in the data ecosystem, which act as legal parents to the current entity.
      properties:
        parents:
          description: An array of entity references identifying the source of data.
          example: []
          items:
            pattern: ^[\w\.\-]+:[\w\.\-]+:[\w\-\.:%]+:[0-9]+$
            type: string
          title: Parents
          type: array
      title: Parent List
      type: object

    LegalTags:
      additionalProperties: false
      description: Legal meta data like legal tags, relevant other countries, legal status.
      properties:
        legaltags:
          description: The list of legal tags.
          items:
            type: string
          title: Legal Tags
          type: array
        otherRelevantDataCountries:
          description: The list of other relevant data countries.
          items:
            pattern: ^[A-Z]{2}$
            type: string
          title: Other Relevant Data Countries
          type: array
        status:
          description: The legal status.
          pattern: ^(compliant|uncompliant)$
          title: Legal Status
          type: string
      required:
        - legaltags
        - otherRelevantDataCountries
      title: Legal Meta Data
      type: object

    CommonResources:
      description: Common resources to be injected at root 'data' level.
      properties:
        ExistenceKind:
          description: Where does this data resource sit in the cradle-to-grave span of its existence?
          pattern: ^[\w\.\-]+:reference-data--ExistenceKind:[\w\.\-:%]+:[0-9]*$
          title: Existence Kind
          type: string
        ResourceCurationStatus:
          description: Describes the current Curation status.
          pattern: ^[\w\.\-]+:reference-data--ResourceCurationStatus:[\w\.\-:%]+:[0-9]*$
          title: Resource Curation Status
          type: string
        ResourceHomeRegionID:
          description: The name of the home region for this OSDU resource object.
          pattern: ^[\w\.\-]+:reference-data--OSDURegion:[\w\.\-:%]+:[0-9]*$
          title: Resource Home Region ID
          type: string
        ResourceHostRegionIDs:
          description: The name of the host region(s) for this OSDU resource object.
          items:
            pattern: ^[\w\.\-]+:reference-data--OSDURegion:[\w\.\-:%]+:[0-9]*$
            type: string
          title: Resource Host Region ID
          type: array
        ResourceLifecycleStatus:
          description: Describes the current Resource Lifecycle status.
          pattern: ^[\w\.\-]+:reference-data--ResourceLifecycleStatus:[\w\.\-:%]+:[0-9]*$
          title: Resource Lifecycle Status
          type: string
        ResourceSecurityClassification:
          description: Classifies the security level of the resource.
          pattern: ^[\w\.\-]+:reference-data--ResourceSecurityClassification:[\w\.\-:%]+:[0-9]*$
          title: Resource Security Classification
          type: string
        Source:
          description: The entity that produced the record.
          title: Data Source
          type: string
      title: OSDU Common Resources
      type: object

    AbstractDataset:
      description: Schema fragment holding properties common for all datasets.
      properties:
        DatasetProperties:
          description: Placeholder for a specialization.
          example: {}
          title: Dataset Properties
          type: object
        Description:
          description: An optional, textual description of the dataset.
          example: As originally delivered by ACME.com.
          title: Description
          type: string
        EncodingFormatTypeID:
          description: EncodingFormatType ID reference value relationship.
          example: "namespace:reference-data--EncodingFormatType:text%2Fcsv:"
          pattern: ^[\w\.\-]+:reference-data--EncodingFormatType:[\w\.\-:%]+:[0-9]*$
          title: Encoding Format Type ID
          type: string
        Endian:
          description: 'Endianness of binary value. Enumeration: "BIG", "LITTLE".'
          enum:
            - BIG
            - LITTLE
          type: string
        Name:
          description: An optional name of the dataset.
          example: Dataset X221/15
          title: Name
          type: string
        SchemaFormatTypeID:
          description: Relationship to the SchemaFormatType reference value.
          example: "namespace:reference-data--SchemaFormatType:CWLS%20LAS3:"
          pattern: ^[\w\.\-]+:reference-data--SchemaFormatType:[\w\.\-:%]+:[0-9]*$
          title: Schema Format Type ID
          type: string
        TotalSize:
          description: Total size of the dataset in bytes.
          example: "13245217273"
          pattern: "[0-9]+"
          title: Total Size
          type: string
      required:
        - DatasetProperties
      title: AbstractDataset
      type: object

    FileSourceInfo:
      description: A schema fragment to describe file source information.
      properties:
        Checksum:
          description: Checksum of file bytes.
          pattern: ^([0-9a-fA-F]{2})+$
          title: Checksum
          type: string
        ChecksumAlgorithm:
          description: The name of the checksum algorithm.
          example: SHA-256
          title: Checksum Algorithm
          type: string
        FileSize:
          description: Length of file in bytes.
          example: "95463"
          pattern: ^[0-9]+$
          title: File Size
          type: string
        FileSource:
          description: The location of the file.
          example: s3://default_bucket/r1/data/provided/documents/1000.witsml
          title: File Source
          type: string
        Name:
          description: Optional, user-friendly file name.
          example: 1000.witsml
          title: Name
          type: string
        PreloadFileCreateDate:
          description: Optional create date and time of the file.
          example: "2019-12-16T11:46:20.163Z"
          format: date-time
          title: Preload File Create Date
          type: string
        PreloadFileCreateUser:
          description: Optional user name who created the file.
          example: somebody@acme.org
          title: Preload File Create User
          type: string
        PreloadFileModifyDate:
          description: Optional last modified date of the file.
          example: "2019-12-20T17:20:05.356Z"
          format: date-time
          title: Preload File Modify Date
          type: string
        PreloadFileModifyUser:
          description: Optional user who last modified the file.
          example: somebody.else@acme.org
          title: Preload File Modify User
          type: string
        PreloadFilePath:
          description: File system path to the data file before loading.
          example: s3://staging-area/r7/raw-data/provided/documents/1000.witsml
          title: Preload File Path
          type: string
      required:
        - FileSource
      title: FileSourceInfo
      type: object

    AbstractFileCollection:
      description: The schema fragment representing file collections.
      properties:
        DatasetProperties:
          description: The dataset properties for a file collection.
          properties:
            Checksum:
              description: MD5 checksum of file bytes.
              pattern: ^[0-9a-fA-F]{32}
              title: MD5 Checksum
              type: string
            FileCollectionPath:
              description: The mandatory path to the file collection.
              example: s3://default_bucket/opendes/data/vds-dataset/
              title: File Collection Path
              type: string
            FileSourceInfos:
              description: Array of file collection members as FileSourceInfo.
              items:
                $ref: "#/components/schemas/FileSourceInfo"
              title: File Source Info Array
              type: array
            IndexFilePath:
              description: An optional path to an index file.
              example: s3://default_bucket/opendes/data/vds-dataset/vds-dataset.index
              title: Index File Path
              type: string
          required:
            - FileCollectionPath
          title: Dataset Properties
          type: object
      required:
        - DatasetProperties
      title: AbstractFileCollection
      type: object

    VectorHeaderMapping:
      description: Array of objects which define the meaning and format of a tabular structure used in a binary file as a header.
      properties:
        VectorHeaderMapping:
          description: Array of objects defining header structure.
          items:
            description: Header mapping object.
            properties:
              KeyName:
                description: Relationship to a reference value for a name of a property header.
                pattern: ^[\w\-\.]+:reference-data--HeaderKeyName:[\w\-\.:%]+:[0-9]*$
                title: Key Name
                type: string
              Position:
                description: Beginning byte position of header value, 1 indexed.
                type: integer
              ScalarIndicator:
                description: Enumerated string indicating scalar handling.
                enum:
                  - STANDARD
                  - NOSCALE
                  - OVERRIDE
                title: Scalar Indicator
                type: string
              ScalarOverride:
                description: Scalar value when override is needed.
                title: Scalar Override
                type: number
              UoM:
                description: Relationship to units of measure reference.
                pattern: ^[\w\-\.]+:reference-data--UnitOfMeasure:[\w\-\.:%]+:[0-9]*$
                title: Unit of Measure
                type: string
              WordFormat:
                description: Relationship to a reference value for binary data types.
                pattern: ^[\w\-\.]+:reference-data--WordFormatType:[\w\-\.:%]+:[0-9]*$
                title: Word Format
                type: string
              WordWidth:
                description: Size of the word in bytes.
                title: Word Width
                type: integer
            type: object
          type: array
      title: AbstractVectorHeaderMapping
      type: object

    # -----------------------------------------------------------------------
    # FileCollection schemas (previously external $ref and inline)
    # -----------------------------------------------------------------------
    FileCollectionOpenZGY:
      additionalProperties: false
      description: The dataset representation for optimized seismic access to the OpenZGY framework developed by Schlumberger, storing seismic 3D data for seismic interpretation.
      properties:
        acl:
          $ref: "#/components/schemas/AccessControlList"
        ancestry:
          $ref: "#/components/schemas/LegalParentList"
        createTime:
          description: Timestamp of the time at which initial version of this OSDU resource object was created.
          example: "2020-12-16T11:46:20.163Z"
          format: date-time
          title: Resource Object Creation DateTime
          type: string
        createUser:
          description: The user reference, which created the first version of this resource object.
          example: some-user@some-company-cloud.com
          title: Resource Object Creation User Reference
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/CommonResources"
            - $ref: "#/components/schemas/AbstractDataset"
            - $ref: "#/components/schemas/AbstractFileCollection"
            - type: object
              properties: {}
              title: IndividualProperties
            - type: object
              properties:
                ExtensionProperties:
                  type: object
              title: ExtensionProperties
        id:
          description: Previously called ResourceID or SRN which identifies this OSDU resource object without version.
          example: "namespace:dataset--FileCollection.Slb.OpenZGY:5771c352-dc52-5d26-9351-2b8dbc9eb474"
          pattern: '[\w\.\-]+:dataset--FileCollection.Slb.OpenZGY:[\w\.\-:%]+$'
          title: Entity ID
          type: string
        kind:
          description: The schema identification for the OSDU resource object.
          example: "osdu:wks:dataset--FileCollection.Slb.OpenZGY:1.0.0"
          pattern: "osdu:wks:dataset--FileCollection.Slb.OpenZGY:1.0.0"
          title: Entity Kind
          type: string
        legal:
          $ref: "#/components/schemas/LegalTags"
        meta:
          description: The Frame of Reference meta data section.
          items:
