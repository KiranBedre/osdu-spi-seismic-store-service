sdms_v4_cspell:
  image: node
  tags: ["osdu-small"]
  stage: scan
  needs: ['sdms_v4_push_runtime_image']
  script:
    - cd app/$SDMS_V4_SERVICE
    - npm install
    - npm run spell > ../../cspell_report.txt
  artifacts:
    paths:
      - cspell_report.txt
    when: always
    expire_in: 2 days
  only:
    changes:
      - devops/**/*
      - app/sdms-v4/**/*
    refs:
      - branches
      - merge_requests
