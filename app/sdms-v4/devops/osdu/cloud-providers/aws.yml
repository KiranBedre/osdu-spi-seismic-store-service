variables:
  #aws variables
  AWS_BUILD_SUBDIR: src/cloud/providers/aws/build-aws
  AWS_CHART_SUBDIR: app/sdms-v4/devops/aws/chart
  AWS_SERVICE_GATEWAY: osdu-services/osdu-gateway
  AWS_ENVIRONMENT: dev
  AWS_DEPLOY_TARGET: TF
  AWS_RUNTIME_DOCKERFILE_PATH: src/cloud/providers/aws/build-aws/runtime.Dockerfile
  # skipping tests here. Using a local file to run tests
  AWS_SKIP_TESTS: "true"
  SDMS_V4_SERVICE_NAME: seismic-ddms-v4
sdms_v4_aws_containerize:
  # extends: .aws-containerize
  extends:
    - .aws
    - .aws_variables
    - .aws_common_variables
  stage: containerize
  variables:
    SHA_IMAGE: ${SDMS_V4_SERVICE_NAME}:${CI_COMMIT_SHA}
    LATEST_IMAGE: ${SDMS_V4_SERVICE_NAME}:latest
    AWS_EKS_DEPLOYMENT_NAME: os-seismic-store-v4
    AWS_IMAGE_TAG_BASE: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_ECR_REGION}.amazonaws.com/os-seismic-store-v4 
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd app/$SDMS_V4_SERVICE  
    - docker build -t $SDMS_V4_UTEST_RUNTIME_IMAGE --file $AWS_RUNTIME_DOCKERFILE_PATH .;
    - cd ../..
    # Push to the localcontainer registry
    - docker tag $SDMS_V4_UTEST_RUNTIME_IMAGE $CI_REGISTRY_IMAGE/$SHA_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$SHA_IMAGE
    - docker tag $CI_REGISTRY_IMAGE/$SHA_IMAGE $CI_REGISTRY_IMAGE/$LATEST_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE
    - docker tag ${CI_REGISTRY_IMAGE}/$LATEST_IMAGE $CI_REGISTRY_IMAGE/${SDMS_V4_PROJECT_NAME}aws:${CI_COMMIT_SHA}
    - docker push $CI_REGISTRY_IMAGE/${SDMS_V4_PROJECT_NAME}aws:${CI_COMMIT_SHA}
    # Push to Amazon's container registry
    - $(aws ecr get-login --no-include-email --region $AWS_ECR_REGION)
    - docker tag $SDMS_V4_UTEST_RUNTIME_IMAGE $AWS_IMAGE_TAG_BASE:$CI_COMMIT_SHA
    - docker tag $SDMS_V4_UTEST_RUNTIME_IMAGE $AWS_IMAGE_TAG_BASE:latest
    - docker push $AWS_IMAGE_TAG_BASE:$CI_COMMIT_SHA
    - docker push $AWS_IMAGE_TAG_BASE:latest
  only:
    variables:
      - $AWS == '1'
    changes:
      - devops/**/*
      - app/sdms-v4/**/*
    refs:
      - branches
      - merge_requests
      - tags

sdms_v4_aws-update-tf:
  extends:
    - .aws
    - .aws_variables
    - .aws_common_variables
  stage: deploy
  allow_failure: false
  # extends:
  #   - .aws-update-tf
  variables:
    AWS_EKS_DEPLOYMENT_NAME: os-seismic-store-v4
    AWS_SERVICE_NAMESPACE_SUFFIX: seismic-store-v4
    AWS_IMAGE_TAG_BASE: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_ECR_REGION}.amazonaws.com/os-seismic-store-v4 
  needs: ['sdms_v4_aws_containerize']
  script:
    - cd app/$SDMS_V4_SERVICE
    - echo $AWS_REGION $EKS_CLUSTER_NAME $EKS_CLUSTER_MGMT_ROLE $AWS_SERVICE_NAMESPACE $AWS_SERVICE_NAMESPACE_SUFFIX $AWS_EKS_DEPLOYMENT_NAME $AWS_IMAGE_TAG_BASE
    - export KUBECONFIG=/tmp/kubeconfig-${RANDOM}.yaml
    - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME --role-arn $EKS_CLUSTER_MGMT_ROLE

    - chmod 600 $KUBECONFIG
    - export CONTAINER_IMAGE=`kubectl -n ${AWS_SERVICE_NAMESPACE}-${AWS_SERVICE_NAMESPACE_SUFFIX} get deployment/${AWS_EKS_DEPLOYMENT_NAME} -o jsonpath='{.spec.template.spec.containers[0].name}'`

    - kubectl -n ${AWS_SERVICE_NAMESPACE}-${AWS_SERVICE_NAMESPACE_SUFFIX} set image deployment/${AWS_EKS_DEPLOYMENT_NAME} $CONTAINER_IMAGE=$AWS_IMAGE_TAG_BASE:$CI_COMMIT_SHA
    - kubectl -n ${AWS_SERVICE_NAMESPACE}-${AWS_SERVICE_NAMESPACE_SUFFIX} rollout restart deployment/${AWS_EKS_DEPLOYMENT_NAME}
    - kubectl -n ${AWS_SERVICE_NAMESPACE}-${AWS_SERVICE_NAMESPACE_SUFFIX} rollout status -w deployment/${AWS_EKS_DEPLOYMENT_NAME} --timeout=300s
  only:
    variables:
      - $AWS_SKIP_DEPLOY != 'true' && $AWS == '1' && $AWS_DEPLOY_TARGET == 'TF'
    changes:
      - devops/**/*
      - app/sdms-v4/**/*
    refs:
      - branches
      - merge_requests
      - tags
sdms_v4_aws_test:
  allow_failure: false
  image: $CI_REGISTRY/osdu/platform/deployment-and-operations/base-containers-aws/aws-node/aws-node:v1.0-node18
  extends:
    - .aws
    - .aws_common_variables
    - .aws_variables
  stage: integration
  needs: ['sdms_v4_aws-update-tf']
  script:    
    - cd app/$SDMS_V4_SERVICE 
    - python3 -m venv .venv
    - source .venv/bin/activate
    - python3 -m pip install -r devops/aws/requirements.txt
    - svctoken=$(python3 ../../devops/scripts/aws_jwt_client.py)
    - npm install
    - chmod +x ./tests/e2e/run.sh
    - ./tests/e2e/run.sh --osdu-url=$AWS_BASE_URL --access-token=$svctoken --partition='osdu' --acl-owners='data.default.owners@osdu.example.com' --acl-viewers='data.default.viewers@osdu.example.com'
  only:
    variables:
      -  $AWS == '1'
    changes:
      - devops/**/*
      - app/sdms-v4/**/*
    refs:
      - branches
      - merge_requests
      - tags
  artifacts:
    when: always
    paths:
      - app/sdms-v4/tests
    expire_in: 14 days
