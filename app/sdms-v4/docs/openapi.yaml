components:
  parameters: 
    data.partition.id:
      in: header
      name: data-partition-id
      description: The data partition id
      required: true
      schema:
        title: data partition id
        description: identifier of the data partition to query
        type: string
        minLength: 1
        example: opendes
    pagination.limit:
      in: query
      name: page-limit
      description: (optional) The size limit of the page (max number of results). If not set 10 will be used as default value.
      schema:
        title: pagination limit
        description: The size limit of the page (max number of results).
        type: number
        example: 10
    pagination.token:
      in: query
      name: next-page-token
      description: (optional) The next page token returned from the previous page request. If not set, the first page will be returned.
      schema:
        title: next page token
        description: The next page token returned from the previous page request. If not set, the first page will be returned.
        type: string
        minLength: 1
        example: 
    id:
      in: path
      name: id
      description: The seismic dataset record ID
      required: true
      schema:
        title: The seismic dataset record ID
        description: THe seismic dataset record ID
        type: string
        minLength: 1
        example: "osdu:dataset:b47f793a-dc9c-5d11-8d59-6cc611a98926"
