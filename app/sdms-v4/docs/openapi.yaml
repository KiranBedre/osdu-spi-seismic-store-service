  ### ==============================================================================
  ### 2D INTERPRETATION SET PATHS
  ### ==============================================================================
  
  /2dinterpretationset/v1:
    put:
      operationId: 2dinterpretationset-v1-insert
      summary: register or update 2D Interpretation Set seismic components
