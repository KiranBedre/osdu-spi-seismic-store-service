  ### ==============================================================================
  ### TRACE DATA PATHS
  ### ==============================================================================
  
  /tracedata/v1:
    put:
      operationId: tracedata-v1-insert
      summary: register or update Trace Data seismic components
      description: |
        Required role: users.datalake.editors or users.datalake.admin
        This API registers or updates a list of Trace Data seismic component. When a component is updated, a new version of it will be created.
        The [Trace Data 1.3.0](https://community.opengroup.org/osdu/data/data-definitions/-/blob/master/Generated/work-product-component/SeismicTraceData.1.3.0.json) data representation is defined by the OSDU authority and is required as a body parameter in this request.
        References to datasets, as record id, can be specified in the
        *Dataset* property of the model. These referenced datasets must exist in SDDMS.
        
        The API returns a list of versioned records ID for the registered or updated datasets.
      tags:
        - work product component Trace Data
      parameters:
        - $ref: "#/components/parameters/data.partition.id"
      requestBody:
        $ref: "#/components/requestBodies/tracedata.1.3.0.list"
      responses:
        200:
          $ref: "#/components/responses/record.id.version.list"  
  /tracedata/v1/list:
    get:
      operationId: tracedata-v1-list
      summary: get the list of Trace Data seismic components
      description: |
        Required role: users.datalake.viewers or users.datalake.editors or users.datalake.admin
              
        Returns a list of Trace Data seismic components
              
        Pagination is supported.
      tags:
        - work product component Trace Data
      parameters:
        - $ref: "#/components/parameters/data.partition.id"
        - $ref: "#/components/parameters/pagination.limit"
        - $ref: "#/components/parameters/pagination.token"
      responses:
        200:
          $ref: "#/components/responses/tracedata.1.3.0.list.paginated"  
  /tracedata/v1/record/{id}:
    get:
      operationId: tracedata-v1-get
      summary: get a Trace Data seismic component
      description: |
        users.datalake.viewers or users.datalake.editors or users.datalake.admin

        This API returns the latest version of a Trace Data seismic component
      tags:
        - work product component Trace Data
      parameters:
      - $ref: "#/components/parameters/data.partition.id"
      - $ref: "#/components/parameters/id"
      responses:
        200:
          $ref: "#/components/responses/tracedata.1.3.0"  
  
    delete:
      operationId: tracedata-v1-delete
      summary: delete a Trace Data component
      description: |
        Required role: users.datalake.admin

        The API performs a deletion of the given Trace Data seismic component.
      tags:
        - work product component Trace Data
      parameters:
        - $ref: "#/components/parameters/data.partition.id"
        - $ref: "#/components/parameters/id"
      responses:
        200:
