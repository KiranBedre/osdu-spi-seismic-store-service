---
# Source: /devops/azure/chart/templates/virtual-service.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
  namespace: osdu
spec:
  hosts:
  - "{{ .Values.istioDnsHost }}"
  gateways:
  - istio-gateway
  http:  
  - match:
    - uri:
        prefix: "/seismic-file-metadata/api"
    route:
    - destination:
        host: {{ .Release.Name }}
        port:
          number: 80
    corsPolicy:
      maxAge: "60m"
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - x-api-key
      allowMethods:
      - GET
      allowOrigins:
      - prefix: "*" 