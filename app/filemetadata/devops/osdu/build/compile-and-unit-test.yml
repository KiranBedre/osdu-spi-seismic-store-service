filemetadata_unit_test:
  image: python
  allow_failure: true
  extends:
    - .azure_variables
  stage: build
  variables:
    AZURE_AD_APP_RESOURCE_ID: $AZURE_APP_ID
    AZURE_AD_TENANT_ID: $AZURE_TENANT_ID
    AZURE_TESTER_SERVICEPRINCIPAL_SECRET: $AZURE_PRINCIPAL_SECRET
    INTEGRATION_TESTER: $AZURE_PRINCIPAL_ID
    DNS: https://${AZURE_DNS_NAME}
  before_script:
    - cd app/$FILEMETADATA_SERVICE/app
  script:
    - python -m venv seimicenv
    - source seimicenv/bin/activate
    - pip install requests msal fastapi python-dotenv httpx azure-monitor-opentelemetry opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-logging azure-keyvault-secrets azure-identity
    - python -m unittest discover -s test -p test_* -v
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH =~ '/^release/'
      when: always
    - if: $CI_COMMIT_BRANCH =~ '/^trusted-'
      when: always
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - devops/**/*
        - app/filemetadata/**/*
      when: always
