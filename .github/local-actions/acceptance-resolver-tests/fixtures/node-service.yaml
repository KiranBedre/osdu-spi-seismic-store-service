# Schema v4 fixture for a Node/TypeScript service with a script acceptance suite.
schemaVersion: 4
service:
  name: seismic
  archetype: node-typescript-azure
  sourcePath: app/sdms
  nodeVersion: "22"
  image:
    context: app/sdms
    dockerfile: app/sdms/devops/azure/runtime.Dockerfile
tests:
  acceptance:
    type: script
    path: app/sdms
    entrypoint: tests/e2e/run_e2e_tests.sh
    arguments:
      - "--seistore-svc-url"
      - "${SVC_URL}"
      - "--user-idtoken"
      - "${STOKEN}"
    reportPaths:
      - "tests/e2e/results/*.xml"
    bindings:
      SVC_URL: { source: gateway, suffix: /seistore-svc/api/v3 }
      STOKEN: { source: token }
